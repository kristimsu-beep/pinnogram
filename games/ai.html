<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>AI Voice</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 42%,
            #18233f 0%,
            #0b1020 35%,
            #05070d 70%,
            #020307 100%
        );

    color: white;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================================
   BACKGROUND
========================================================= */

.background-glow {
    position: fixed;

    width: 70vw;
    height: 70vw;

    max-width: 700px;
    max-height: 700px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(80,130,255,.14),
            rgba(60,90,255,.05) 40%,
            transparent 70%
        );

    filter: blur(25px);

    pointer-events: none;
}


/* =========================================================
   MAIN
========================================================= */

#app {
    position: relative;

    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;
}


/* =========================================================
   TITLE
========================================================= */

#title {
    position: absolute;

    top: 35px;

    font-size: 18px;
    font-weight: 500;

    letter-spacing: .5px;

    opacity: .8;
}


/* =========================================================
   ORB
========================================================= */

#orbArea {

    position: relative;

    width: min(75vw, 420px);
    height: min(75vw, 420px);

    display: flex;

    align-items: center;
    justify-content: center;

    cursor: pointer;

    user-select: none;
}


/*
 * Outer atmosphere
 */

#orbAtmosphere {

    position: absolute;

    width: 100%;
    height: 100%;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            rgba(65,130,255,.20) 0%,
            rgba(50,100,255,.10) 35%,
            transparent 70%
        );

    filter: blur(18px);

    transform: scale(1);

    transition:
        transform .08s linear;
}


/*
 * Main sphere
 */

#orb {

    position: relative;

    width: 67%;
    height: 67%;

    border-radius: 50%;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 32% 27%,
            rgba(255,255,255,.85) 0%,
            rgba(180,215,255,.38) 3%,
            rgba(90,145,255,.30) 12%,
            rgba(30,60,150,.55) 35%,
            rgba(8,15,50,.95) 70%,
            rgba(1,3,12,1) 100%
        );

    box-shadow:
        0 0 20px rgba(80,140,255,.5),
        0 0 60px rgba(50,110,255,.28),
        inset 12px 12px 30px rgba(255,255,255,.08),
        inset -20px -20px 40px rgba(0,0,0,.7);

    transform:
        scale(1)
        rotateX(0deg)
        rotateY(0deg);

    transition:
        box-shadow .25s ease;

    will-change:
        transform,
        filter;
}


/*
 * Internal moving light
 */

#orb::before {

    content: "";

    position: absolute;

    width: 160%;
    height: 160%;

    left: -30%;
    top: -30%;

    border-radius: 50%;

    background:
        conic-gradient(
            from 0deg,
            transparent,
            rgba(90,150,255,.35),
            transparent,
            rgba(120,180,255,.25),
            transparent
        );

    animation:
        orbRotate 9s linear infinite;

    mix-blend-mode: screen;
}


/*
 * Glass reflection
 */

#orb::after {

    content: "";

    position: absolute;

    width: 42%;
    height: 22%;

    top: 12%;
    left: 18%;

    border-radius: 50%;

    background:
        linear-gradient(
            140deg,
            rgba(255,255,255,.55),
            rgba(255,255,255,.05)
        );

    filter: blur(5px);

    transform:
        rotate(-25deg);

    opacity: .65;
}


@keyframes orbRotate {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* =========================================================
   STATES
========================================================= */

#orb.listening {

    box-shadow:
        0 0 25px rgba(80,150,255,.75),
        0 0 80px rgba(50,130,255,.55),
        0 0 150px rgba(40,100,255,.25),
        inset 12px 12px 30px rgba(255,255,255,.10),
        inset -20px -20px 40px rgba(0,0,0,.7);
}


#orb.thinking {

    animation:
        thinkingPulse 1.8s ease-in-out infinite;
}


@keyframes thinkingPulse {

    0%,
    100% {
        filter:
            brightness(1)
            saturate(1);
    }

    50% {
        filter:
            brightness(1.35)
            saturate(1.25);
    }

}


#orb.speaking {

    box-shadow:
        0 0 30px rgba(100,160,255,.9),
        0 0 100px rgba(60,130,255,.65),
        0 0 180px rgba(60,110,255,.3),
        inset 12px 12px 30px rgba(255,255,255,.12),
        inset -20px -20px 40px rgba(0,0,0,.65);
}


/* =========================================================
   STATUS
========================================================= */

#status {

    position: absolute;

    bottom: 105px;

    font-size: 15px;

    color:
        rgba(255,255,255,.72);

    text-align: center;

    min-height: 22px;

    padding:
        0 25px;
}


/* =========================================================
   TRANSCRIPT
========================================================= */

#transcript {

    position: absolute;

    bottom: 55px;

    width: min(90%, 650px);

    text-align: center;

    color:
        rgba(255,255,255,.55);

    font-size: 13px;

    min-height: 18px;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}


/* =========================================================
   BUTTON HINT
========================================================= */

#hint {

    position: absolute;

    bottom: 22px;

    font-size: 11px;

    color:
        rgba(255,255,255,.35);
}


/* =========================================================
   ERROR
========================================================= */

#error {

    position: fixed;

    left: 50%;

    bottom: 25px;

    transform: translateX(-50%);

    width: min(90%, 500px);

    padding: 12px 16px;

    border-radius: 12px;

    background:
        rgba(180,40,50,.85);

    color: white;

    font-size: 13px;

    text-align: center;

    display: none;

    z-index: 100;
}

</style>
</head>

<body>

<div class="background-glow"></div>

<div id="app">

    <div id="title">
        AI Voice
    </div>

    <div id="orbArea">

        <div id="orbAtmosphere"></div>

        <div id="orb"></div>

    </div>

    <div id="status">
        Нажмите на шар
    </div>

    <div id="transcript"></div>

    <div id="hint">
        Нажмите ещё раз, чтобы остановить запись
    </div>

</div>

<div id="error"></div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const orbArea =
    document.getElementById("orbArea");

const orb =
    document.getElementById("orb");

const orbAtmosphere =
    document.getElementById("orbAtmosphere");

const statusElement =
    document.getElementById("status");

const transcriptElement =
    document.getElementById("transcript");

const hint =
    document.getElementById("hint");

const errorElement =
    document.getElementById("error");


/* =========================================================
   STATE
========================================================= */

let mediaStream = null;

let mediaRecorder = null;

let audioChunks = [];

let audioContext = null;

let analyser = null;

let microphoneSource = null;

let animationFrame = null;

let silenceTimer = null;

let recording = false;

let processing = false;

let speaking = false;

let currentAudio = null;


/*
 * История разговора.
 */

let conversation = [];


/*
 * Последнее время, когда был звук.
 */

let lastSoundTime = 0;


/*
 * Автоматическая остановка после тишины.
 */

const SILENCE_LIMIT = 1500;


/*
 * Порог речи.
 *
 * Чем меньше число,
 * тем чувствительнее микрофон.
 */

const SILENCE_THRESHOLD = 0.018;


/* =========================================================
   UI
========================================================= */

function setStatus(text) {

    statusElement.textContent = text;
}


function showError(text) {

    console.error(text);

    errorElement.textContent = text;

    errorElement.style.display = "block";

    setTimeout(() => {

        errorElement.style.display = "none";

    }, 5000);
}


/* =========================================================
   ORB ANIMATION
========================================================= */

function animateOrb() {

    if (!analyser) {
        animationFrame = requestAnimationFrame(
            animateOrb
        );

        return;
    }


    const data =
        new Uint8Array(
            analyser.fftSize
        );


    analyser.getByteTimeDomainData(data);


    let sum = 0;


    for (let i = 0; i < data.length; i++) {

        const value =
            (data[i] - 128) / 128;

        sum += value * value;
    }


    const rms =
        Math.sqrt(
            sum / data.length
        );


    /*
     * Увеличиваем реакцию шара
     * на громкость.
     */

    const intensity =
        Math.min(
            1,
            rms * 8
        );


    const scale =
        1 +
        intensity * .18;


    const x =
        intensity * 4;

    const y =
        intensity * 3;


    orb.style.transform =
        `
        scale(${scale})
        rotateX(${y}deg)
        rotateY(${x}deg)
        `;


    orbAtmosphere.style.transform =
        `scale(${1 + intensity * .35})`;


    /*
     * Если идёт запись,
     * определяем наличие речи.
     */

    if (recording) {

        if (
            rms >
            SILENCE_THRESHOLD
        ) {

            lastSoundTime =
                Date.now();

        }

        else if (
            Date.now() -
            lastSoundTime >
            SILENCE_LIMIT
        ) {

            stopRecording();

        }
    }


    animationFrame =
        requestAnimationFrame(
            animateOrb
        );
}


/* =========================================================
   GET MICROPHONE
========================================================= */

async function getMicrophone() {

    if (!navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia) {

        throw new Error(
            "Ваш браузер не поддерживает микрофон."
        );
    }


    mediaStream =
        await navigator.mediaDevices.getUserMedia({
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true
            }
        });


    audioContext =
        new (
            window.AudioContext ||
            window.webkitAudioContext
        )();


    microphoneSource =
        audioContext.createMediaStreamSource(
            mediaStream
        );


    analyser =
        audioContext.createAnalyser();


    analyser.fftSize = 512;

    analyser.smoothingTimeConstant = .75;


    microphoneSource.connect(
        analyser
    );


    lastSoundTime =
        Date.now();


    animateOrb();
}


/* =========================================================
   FIND RECORDING FORMAT
========================================================= */

function getMimeType() {

    const formats = [

        "audio/webm;codecs=opus",

        "audio/webm",

        "audio/ogg;codecs=opus",

        "audio/mp4"

    ];


    for (const format of formats) {

        if (
            MediaRecorder.isTypeSupported(
                format
            )
        ) {

            return format;
        }
    }


    return "";
}


/* =========================================================
   START RECORDING
========================================================= */

async function startRecording() {

    if (processing) {
        return;
    }


    try {

        if (!mediaStream) {

            await getMicrophone();
        }


        audioChunks = [];


        const mimeType =
            getMimeType();


        mediaRecorder =
            mimeType
                ? new MediaRecorder(
                    mediaStream,
                    {
                        mimeType
                    }
                )
                : new MediaRecorder(
                    mediaStream
                );


        mediaRecorder.ondataavailable =
            event => {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    audioChunks.push(
                        event.data
                    );
                }
            };


        mediaRecorder.onstop =
            processRecording;


        mediaRecorder.start();


        recording = true;

        speaking = false;

        lastSoundTime =
            Date.now();


        orb.classList.add(
            "listening"
        );

        orb.classList.remove(
            "speaking",
            "thinking"
        );


        setStatus(
            "Слушаю..."
        );

        hint.textContent =
            "Нажмите на шар, чтобы отправить";


    } catch (error) {

        showError(
            "Не удалось получить доступ к микрофону."
        );

        console.error(error);
    }
}


/* =========================================================
   STOP RECORDING
========================================================= */

function stopRecording() {

    if (
        !mediaRecorder ||
        mediaRecorder.state === "inactive"
    ) {

        return;
    }


    recording = false;


    orb.classList.remove(
        "listening"
    );

    orb.classList.add(
        "thinking"
    );


    setStatus(
        "Обрабатываю..."
    );


    mediaRecorder.stop();
}


/* =========================================================
   PROCESS RECORDING
========================================================= */

async function processRecording() {

    processing = true;


    try {

        const mimeType =
            mediaRecorder.mimeType ||
            "audio/webm";


        const blob =
            new Blob(
                audioChunks,
                {
                    type: mimeType
                }
            );


        if (blob.size < 1000) {

            throw new Error(
                "Запись получилась слишком короткой."
            );
        }


        const formData =
            new FormData();


        let extension =
            "webm";


        if (
            mimeType.includes("ogg")
        ) {

            extension = "ogg";

        } else if (
            mimeType.includes("mp4")
        ) {

            extension = "mp4";
        }


        formData.append(
            "audio",
            blob,
            "voice." + extension
        );


        /*
         * Передаём историю разговора,
         * чтобы AI помнил предыдущие сообщения.
         */

        formData.append(
            "history",
            JSON.stringify(
                conversation
            )
        );


        const response =
            await fetch(
                "/api/ai/voice",
                {
                    method: "POST",
                    body: formData
                }
            );


        if (!response.ok) {

            let message =
                "Ошибка сервера.";

            try {

                const data =
                    await response.json();

                if (data.detail) {
                    message =
                        data.detail;
                }

            } catch (_) {}


            throw new Error(message);
        }


        const data =
            await response.json();


        /*
         * Показываем распознанный текст.
         */

        transcriptElement.textContent =
            data.transcript || "";


        /*
         * Добавляем историю.
         */

        if (data.transcript) {

            conversation.push({
                role: "user",
                content: data.transcript
            });
        }


        if (data.text) {

            conversation.push({
                role: "assistant",
                content: data.text
            });
        }


        /*
         * Ограничиваем историю,
         * чтобы запросы не становились
         * бесконечными.
         */

        if (conversation.length > 20) {

            conversation =
                conversation.slice(
                    conversation.length - 20
                );
        }


        /*
         * Проигрываем ответ.
         */

        if (data.audio) {

            await playResponse(
                data.audio
            );

        } else {

            setStatus(
                "Готово"
            );
        }


    } catch (error) {

        console.error(error);

        orb.classList.remove(
            "thinking",
            "speaking"
        );

        setStatus(
            "Произошла ошибка"
        );

        showError(
            error.message ||
            "Не удалось обработать голос."
        );

    } finally {

        processing = false;

        hint.textContent =
            "Нажмите на шар, чтобы начать говорить";
    }
}

   PLAY AI AUDIO
========================================================= */
