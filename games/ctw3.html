<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>CTW3 — Conquer The World</title>


    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    ></script>


    <!-- =====================================================
         DAY / NIGHT TERMINATOR
    ====================================================== -->

    <script
        src="https://unpkg.com/@joergdietrich/leaflet.terminator"
    ></script>


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;

            overflow: hidden;

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #05070b;

            color: white;
        }


        /* =====================================================
           MAP
        ====================================================== */

        #ctw3Map {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 1;

            background: #b9d9e8;
        }


        /* =====================================================
           TOP BAR
        ====================================================== */

        #ctw3TopBar {

            position: fixed;

            top: 16px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 1000;

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 6px;

            background:
                rgba(8, 12, 20, 0.78);

            border:
                1px solid rgba(255,255,255,0.12);

            border-radius: 14px;

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 10px 35px
                rgba(0,0,0,0.35);
        }


        .ctw3-mode-button {

            border: none;

            background: transparent;

            color:
                rgba(255,255,255,0.55);

            padding:
                9px 16px;

            border-radius: 10px;

            font-size: 12px;

            font-weight: 700;

            cursor: pointer;

            display: flex;

            align-items: center;

            gap: 8px;

            transition:
                0.2s ease;
        }


        .ctw3-mode-button:hover {

            color: white;

            background:
                rgba(255,255,255,0.07);
        }


        .ctw3-mode-button.active {

            color: white;

            background:
                rgba(0,180,255,0.18);

            box-shadow:
                inset 0 0 0 1px
                rgba(0,200,255,0.28);
        }


        /* =====================================================
           GAME TITLE
        ====================================================== */

        #ctw3Title {

            position: fixed;

            top: 18px;
            left: 18px;

            z-index: 1000;

            display: flex;

            align-items: center;

            gap: 10px;

            padding:
                10px 14px;

            background:
                rgba(8,12,20,0.78);

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 12px;

            backdrop-filter:
                blur(16px);

            -webkit-backdrop-filter:
                blur(16px);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.30);
        }


        #ctw3TitleIcon {

            width: 34px;
            height: 34px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 9px;

            background:
                rgba(0,190,255,0.15);

            color:
                #54d7ff;

            font-size: 16px;
        }


        #ctw3TitleText {

            display: flex;

            flex-direction: column;

            gap: 2px;
        }


        #ctw3TitleText strong {

            font-size: 14px;

            font-weight: 800;
        }


        #ctw3TitleText span {

            font-size: 10px;

            color:
                rgba(255,255,255,0.42);

            letter-spacing:
                0.5px;
        }


        /* =====================================================
           STATUS
        ====================================================== */

        #ctw3Status {

            position: fixed;

            bottom: 18px;
            left: 18px;

            z-index: 1000;

            padding:
                8px 12px;

            background:
                rgba(8,12,20,0.78);

            border:
                1px solid rgba(255,255,255,0.10);

            border-radius: 10px;

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            font-size: 11px;

            color:
                rgba(255,255,255,0.65);
        }


        /* =====================================================
           MAP MODE LABEL
        ====================================================== */

        #ctw3ModeLabel {

            position: fixed;

            bottom: 18px;
            right: 18px;

            z-index: 1000;

            padding:
                8px 12px;

            border-radius: 10px;

            background:
                rgba(8,12,20,0.78);

            border:
                1px solid rgba(255,255,255,0.10);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);

            font-size: 11px;

            color:
                rgba(255,255,255,0.7);
        }


        /* =====================================================
           LEAFLET CONTROLS
        ====================================================== */

        .leaflet-control-zoom {

            border: none !important;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.35) !important;
        }


        .leaflet-control-zoom a {

            background:
                rgba(8,12,20,0.85) !important;

            color:
                white !important;

            border-color:
                rgba(255,255,255,0.10) !important;
        }


        .leaflet-control-attribution {

            background:
                rgba(0,0,0,0.55) !important;

            color:
                rgba(255,255,255,0.6) !important;
        }


        .leaflet-control-attribution a {

            color:
                #8bdfff !important;
        }


        /* =====================================================
           NIGHT OVERLAY
        ====================================================== */

        .ctw3-night {

            mix-blend-mode:
                multiply;
        }


        /* =====================================================
           COUNTRY REGISTRATION OVERLAY
        ====================================================== */

        #ctw3RegistrationOverlay {

            position: fixed;

            inset: 0;

            z-index: 5000;

            display: none;

            align-items: center;
            justify-content: center;

            padding: 20px;

            background:
                rgba(3, 6, 12, 0.78);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);
        }


        /* =====================================================
           REGISTRATION CARD
        ====================================================== */

        #ctw3Registration {

            width:
                min(430px, 100%);

            padding: 30px;

            background:
                rgba(12, 17, 27, 0.97);

            border:
                1px solid
                rgba(255,255,255,0.12);

            border-radius: 22px;

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.55);

            text-align: left;
        }


        /* =====================================================
           REGISTRATION ICON
        ====================================================== */

        #ctw3RegistrationIcon {

            width: 64px;
            height: 64px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin:
                0 auto 18px;

            border-radius: 18px;

            background:
                rgba(0,190,255,0.14);

            border:
                1px solid
                rgba(0,210,255,0.20);

            font-size: 32px;
        }


        /* =====================================================
           REGISTRATION TITLE
        ====================================================== */

        #ctw3Registration h1 {

            margin: 0;

            text-align: center;

            font-size: 24px;

            font-weight: 800;

            color: white;
        }


        /* =====================================================
           REGISTRATION DESCRIPTION
        ====================================================== */

        .ctw3-registration-description {

            margin:
                10px 0 26px;

            text-align: center;

            color:
                rgba(255,255,255,0.52);

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           REGISTRATION LABELS
        ====================================================== */

        #ctw3Registration label {

            display: block;

            margin:
                16px 0 7px;

            font-size: 12px;

            font-weight: 700;

            color:
                rgba(255,255,255,0.72);
        }


        /* =====================================================
           REGISTRATION INPUTS
        ====================================================== */

        #ctw3Registration input,
        #ctw3Registration select {

            width: 100%;

            height: 46px;

            padding:
                0 14px;

            border:
                1px solid
                rgba(255,255,255,0.10);

            border-radius: 12px;

            outline: none;

            background:
                rgba(255,255,255,0.055);

            color: white;

            font-family: inherit;

            font-size: 14px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        #ctw3Registration input::placeholder {

            color:
                rgba(255,255,255,0.28);
        }


        #ctw3Registration input:focus,
        #ctw3Registration select:focus {

            border-color:
                rgba(0,200,255,0.55);

            background:
                rgba(255,255,255,0.075);

            box-shadow:
                0 0 0 3px
                rgba(0,190,255,0.10);
        }


        #ctw3Registration select {

            cursor: pointer;
        }


        /* =====================================================
           REGISTRATION ERROR
        ====================================================== */

        .ctw3-registration-error {

            min-height: 20px;

            margin-top: 12px;

            color:
                #ff7272;

            font-size: 12px;

            line-height: 1.4;

            text-align: center;
        }


        /* =====================================================
           CREATE BUTTON
        ====================================================== */

        #ctw3CreateCountryButton {

            width: 100%;

            height: 48px;

            margin-top: 8px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #00aeea,
                    #0077ff
                );

            color: white;

            font-family: inherit;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 25px
                rgba(0,150,255,0.25);

            transition:
                transform 0.15s ease,
                filter 0.15s ease,
                opacity 0.15s ease;
        }


        #ctw3CreateCountryButton:hover {

            filter:
                brightness(1.08);

            transform:
                translateY(-1px);
        }


        #ctw3CreateCountryButton:active {

            transform:
                translateY(0);
        }


        #ctw3CreateCountryButton:disabled {

            opacity:
                0.55;

            cursor:
                wait;

            transform:
                none;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 700px) {

            #ctw3Title {

                top: 10px;
                left: 10px;

                padding:
                    8px 10px;
            }


            #ctw3TitleText span {

                display: none;
            }


            #ctw3TopBar {

                top: 70px;
            }


            .ctw3-mode-button {

                padding:
                    8px 11px;
            }


            #ctw3Registration {

                padding: 24px;

                border-radius: 18px;
            }


            #ctw3Registration h1 {

                font-size: 21px;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="ctw3Map"></div>


    <!-- =====================================================
         GAME TITLE
    ====================================================== -->

    <div id="ctw3Title">

        <div id="ctw3TitleIcon">

            <i class="fa-solid fa-earth-americas"></i>

        </div>


        <div id="ctw3TitleText">

            <strong>
                CTW3
            </strong>

            <span>
                CONQUER THE WORLD
            </span>

        </div>

    </div>


    <!-- =====================================================
         MAP MODE SWITCHER
    ====================================================== -->

    <div id="ctw3TopBar">

        <button
            class="ctw3-mode-button active"
            id="ctw3NormalButton"
            onclick="setCTW3MapMode('normal')"
        >

            <i class="fa-solid fa-map"></i>

            Обычная

        </button>


        <button
            class="ctw3-mode-button"
            id="ctw3SatelliteButton"
            onclick="setCTW3MapMode('satellite')"
        >

            <i class="fa-solid fa-satellite"></i>

            Спутник

        </button>

    </div>


    <!-- =====================================================
         STATUS
    ====================================================== -->

    <div id="ctw3Status">

        🌍 CTW3 загружается...

    </div>


    <!-- =====================================================
         CURRENT MODE
    ====================================================== -->

    <div id="ctw3ModeLabel">

        🗺️ Обычная карта

    </div>


    <!-- =====================================================
         COUNTRY REGISTRATION
    ====================================================== -->

    <div id="ctw3RegistrationOverlay">

        <div id="ctw3Registration">


            <div id="ctw3RegistrationIcon">

                🌍

            </div>


            <h1>

                Создание государства

            </h1>


            <p class="ctw3-registration-description">

                Зарегистрируйте своё государство,
                чтобы начать игру в CTW3.

            </p>


            <!-- =================================================
                 COUNTRY NAME
            ================================================== -->

            <label
                for="ctw3CountryName"
            >

                Название государства

            </label>


            <input
                id="ctw3CountryName"
                type="text"
                maxlength="40"
                placeholder="Например: Израиль"
                autocomplete="off"
            >


            <!-- =================================================
                 FLAG
            ================================================== -->

            <label
                for="ctw3CountryFlag"
            >

                Флаг

            </label>


            <input
                id="ctw3CountryFlag"
                type="text"
                maxlength="4"
                value="🏳️"
                placeholder="🇺🇳"
                autocomplete="off"
            >


            <!-- =================================================
                 LANGUAGE
            ================================================== -->

            <label
                for="ctw3CountryLanguage"
            >

                Основной язык

            </label>


            <select
                id="ctw3CountryLanguage"
            >

                <option value="Русский">
                    Русский
                </option>

                <option value="English">
                    English
                </option>

                <option value="Deutsch">
                    Deutsch
                </option>

                <option value="Français">
                    Français
                </option>

                <option value="Español">
                    Español
                </option>

                <option value="العربية">
                    العربية
                </option>

                <option value="中文">
                    中文
                </option>

                <option value="日本語">
                    日本語
                </option>

                <option value="Português">
                    Português
                </option>

            </select>


            <!-- =================================================
                 ERROR
            ================================================== -->

            <div
                id="ctw3RegistrationError"
                class="ctw3-registration-error"
            ></div>


            <!-- =================================================
                 CREATE
            ================================================== -->

            <button
                id="ctw3CreateCountryButton"
                type="button"
                onclick="createCTW3Country()"
            >

                🌍 Создать государство

            </button>

        </div>

    </div>


    <script>


        // =====================================================
        // CTW3 MAP
        // =====================================================

        let ctw3Map;

        let ctw3NormalLayer;

        let ctw3SatelliteLayer;

        let ctw3NightLayer;


        // =====================================================
        // CURRENT PLAYER COUNTRY
        // =====================================================

        let ctw3Country = null;


        // =====================================================
        // LOCAL STORAGE
        // =====================================================

        const CTW3_MAP_MODE_KEY =
            "ctw3_map_mode";


        let ctw3CurrentMode =
            localStorage.getItem(
                CTW3_MAP_MODE_KEY
            ) || "normal";


        // =====================================================
        // INITIALIZATION
        // =====================================================

        function initCTW3() {


            ctw3Map =
                L.map(
                    "ctw3Map",
                    {

                        center:
                            [20, 0],

                        zoom:
                            2,

                        minZoom:
                            2,

                        maxZoom:
                            18,

                        worldCopyJump:
                            true,

                        zoomControl:
                            true

                    }
                );


            // =================================================
            // NORMAL MAP
            // =================================================

            ctw3NormalLayer =
                L.tileLayer(
                    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
                    {

                        maxZoom:
                            19,

                        attribution:
                            "&copy; OpenStreetMap contributors"

                    }
                );


            // =================================================
            // SATELLITE MAP
            // =================================================

            ctw3SatelliteLayer =
                L.tileLayer(
                    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                    {

                        maxZoom:
                            19,

                        attribution:
                            "Tiles &copy; Esri"

                    }
                );


            // =================================================
            // NIGHT
            // =================================================

            ctw3NightLayer =
                L.terminator(
                    {

                        fillColor:
                            "#000000",

                        fillOpacity:
                            0.42,

                        color:
                            "#000000",

                        opacity:
                            0,

                        weight:
                            0

                    }
                );


            // =================================================
            // APPLY SAVED MAP MODE
            // =================================================

            applyCTW3MapMode(
                ctw3CurrentMode
            );


            // =================================================
            // NIGHT LAYER
            // =================================================

            ctw3NightLayer.addTo(
                ctw3Map
            );


            // =================================================
            // UPDATE NIGHT
            // =================================================

            setInterval(
                updateCTW3Night,
                60 * 1000
            );


            updateCTW3Night();


            // =================================================
            // STATUS
            // =================================================

            updateCTW3Status(
                "🌍 CTW3 готов"
            );


            console.log(
                "[CTW3] Map initialized"
            );

        }


        // =====================================================
        // MAP MODE
        // =====================================================

        function setCTW3MapMode(
            mode
        ) {


            if (
                mode !== "normal" &&
                mode !== "satellite"
            ) {

                mode =
                    "normal";

            }


            ctw3CurrentMode =
                mode;


            localStorage.setItem(
                CTW3_MAP_MODE_KEY,
                mode
            );


            applyCTW3MapMode(
                mode
            );

        }


        // =====================================================
        // APPLY MAP MODE
        // =====================================================

        function applyCTW3MapMode(
            mode
        ) {


            if (!ctw3Map) {

                return;

            }


            // =================================================
            // REMOVE NORMAL
            // =================================================

            if (
                ctw3Map.hasLayer(
                    ctw3NormalLayer
                )
            ) {

                ctw3Map.removeLayer(
                    ctw3NormalLayer
                );

            }


            // =================================================
            // REMOVE SATELLITE
            // =================================================

            if (
                ctw3Map.hasLayer(
                    ctw3SatelliteLayer
                )
            ) {

                ctw3Map.removeLayer(
                    ctw3SatelliteLayer
                );

            }


            // =================================================
            // SATELLITE
            // =================================================

            if (
                mode === "satellite"
            ) {


                ctw3SatelliteLayer.addTo(
                    ctw3Map
                );


                document
                    .getElementById(
                        "ctw3SatelliteButton"
                    )
                    .classList.add(
                        "active"
                    );


                document
                    .getElementById(
                        "ctw3NormalButton"
                    )
                    .classList.remove(
                        "active"
                    );


                document
                    .getElementById(
                        "ctw3ModeLabel"
                    )
                    .textContent =
                        "🛰️ Спутниковая карта";


            }

            // =================================================
            // NORMAL
            // =================================================

            else {


                ctw3NormalLayer.addTo(
                    ctw3Map
                );


                document
                    .getElementById(
                        "ctw3NormalButton"
                    )
                    .classList.add(
                        "active"
                    );


                document
                    .getElementById(
                        "ctw3SatelliteButton"
                    )
                    .classList.remove(
                        "active"
                    );


                document
                    .getElementById(
                        "ctw3ModeLabel"
                    )
                    .textContent =
                        "🗺️ Обычная карта";

            }

        }


        // =====================================================
        // DAY / NIGHT
        // =====================================================

        function updateCTW3Night() {


            if (
                !ctw3NightLayer
            ) {

                return;

            }


            try {

                ctw3NightLayer.setTime(
                    new Date()
                );

            }

            catch (error) {

                console.warn(
                    "[CTW3] Night update error:",
                    error
                );

            }

        }


        // =====================================================
        // STATUS
        // =====================================================

        function updateCTW3Status(
            text
        ) {


            const element =
                document.getElementById(
                    "ctw3Status"
                );


            if (element) {

                element.textContent =
                    text;

            }

        }


        // =====================================================
        // REGISTRATION
        // LOAD PLAYER COUNTRY
        // =====================================================

        async function loadCTW3Country() {


            try {


                updateCTW3Status(
                    "🌍 Проверяем государство..."
                );


                const response =
                    await fetch(
                        "/api/ctw3/country",
                        {

                            method:
                                "GET",

                            credentials:
                                "same-origin"

                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "HTTP " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                // =================================================
                // COUNTRY EXISTS
                // =================================================

                if (
                    data.registered === true &&
                    data.country
                ) {


                    ctw3Country =
                        data.country;


                    window.ctw3Country =
                        data.country;


                    hideCTW3Registration();


                    updateCTW3Status(
                        "🌍 " +
                        (
                            data.country.flag ||
                            "🏳️"
                        ) +
                        " " +
                        data.country.name
                    );


                    console.log(
                        "[CTW3] Country loaded:",
                        data.country
                    );


                    return;

                }


                // =================================================
                // NO COUNTRY
                // =================================================

                showCTW3Registration();


                updateCTW3Status(
                    "🌍 Создайте своё государство"
                );

            }


            catch (error) {


                console.error(
                    "[CTW3] Country loading error:",
                    error
                );


                showCTW3Registration();


                showCTW3RegistrationError(
                    "Не удалось подключиться к серверу."
                );


                updateCTW3Status(
                    "⚠️ Ошибка подключения"
                );

            }

        }


        // =====================================================
        // SHOW REGISTRATION
        // =====================================================

        function showCTW3Registration() {


            const overlay =
                document.getElementById(
                    "ctw3RegistrationOverlay"
                );


            if (!overlay) {

                return;

            }


            overlay.style.display =
                "flex";

        }


        // =====================================================
        // HIDE REGISTRATION
        // =====================================================

        function hideCTW3Registration() {


            const overlay =
                document.getElementById(
                    "ctw3RegistrationOverlay"
                );


            if (!overlay) {

                return;

            }


            overlay.style.display =
                "none";

        }


        // =====================================================
        // REGISTRATION ERROR
        // =====================================================

        function showCTW3RegistrationError(
            message
        ) {


            const element =
                document.getElementById(
                    "ctw3RegistrationError"
                );


            if (!element) {

                return;

            }


            element.textContent =
                message || "";

        }


        // =====================================================
        // CREATE COUNTRY
        // =====================================================

        async function createCTW3Country() {


            const nameInput =
                document.getElementById(
                    "ctw3CountryName"
                );


            const flagInput =
                document.getElementById(
                    "ctw3CountryFlag"
                );


            const languageInput =
                document.getElementById(
                    "ctw3CountryLanguage"
                );


            const button =
                document.getElementById(
                    "ctw3CreateCountryButton"
                );


            const name =
                nameInput.value.trim();


            const flag =
                flagInput.value.trim();


            const language =
                languageInput.value.trim();


            // =================================================
            // CLEAR ERROR
            // =================================================

            showCTW3RegistrationError(
                ""
            );


            // =================================================
            // VALIDATE NAME
            // =================================================

            if (!name) {


                showCTW3RegistrationError(
                    "Введите название государства."
                );


                nameInput.focus();


                return;

            }


            // =================================================
            // VALIDATE FLAG
            // =================================================

            if (!flag) {


                showCTW3RegistrationError(
                    "Укажите флаг государства."
                );


                flagInput.focus();


                return;

            }


            // =================================================
            // VALIDATE LANGUAGE
            // =================================================

            if (!language) {


                showCTW3RegistrationError(
                    "Выберите основной язык."
                );


                languageInput.focus();


                return;

            }


            // =================================================
            // LOADING STATE
            // =================================================

            button.disabled =
                true;


            button.textContent =
                "🌍 Создание государства...";


            updateCTW3Status(
                "🌍 Создаём государство..."
            );


            try {


                const response =
                    await fetch(
                        "/api/ctw3/country",
                        {

                            method:
                                "POST",

                            credentials:
                                "same-origin",

                            headers:
                                {
                                    "Content-Type":
                                        "application/json"
                                },

                            body:
                                JSON.stringify(
                                    {

                                        name:
                                            name,

                                        flag:
                                            flag,

                                        language:
                                            language

                                    }
                                )

                        }
                    );


                let data;


                try {

                    data =
                        await response.json();

                }

                catch {

                    data =
                        {};

                }


                // =================================================
                // SERVER ERROR
                // =================================================

                if (!response.ok) {


                    throw new Error(
                        data.detail ||
                        "Не удалось создать государство."
                    );

                }


                // =================================================
                // CHECK SERVER RESPONSE
                // =================================================

                if (
                    data.status !==
                        "success" ||
                    !data.country
                ) {


                    throw new Error(
                        "Сервер вернул некорректный ответ."
                    );

                }


                // =================================================
                // SAVE COUNTRY
                // =================================================

                ctw3Country =
                    data.country;


                window.ctw3Country =
                    data.country;


                // =================================================
                // HIDE REGISTRATION
                // =================================================

                hideCTW3Registration();


                // =================================================
                // STATUS
                // =================================================

                updateCTW3Status(
                    "🌍 " +
                    (
                        data.country.flag ||
                        "🏳️"
                    ) +
                    " " +
                    data.country.name
                );


                console.log(
                    "[CTW3] Country created:",
                    data.country
                );


                // =================================================
                // TEMPORARY MESSAGE
                // =================================================

                alert(
                    "Государство создано!\n\n" +
                    (
                        data.country.flag ||
                        "🏳️"
                    ) +
                    " " +
                    data.country.name +
                    "\n\n" +
                    "Следующий этап — выбор территории."
                );


            }


            catch (error) {


                console.error(
                    "[CTW3] Country creation error:",
                    error
                );


                showCTW3RegistrationError(
                    error.message ||
                    "Не удалось создать государство."
                );


                updateCTW3Status(
                    "⚠️ Ошибка создания государства"
                );

            }


            finally {


                button.disabled =
                    false;


                button.textContent =
                    "🌍 Создать государство";

            }

        }


        // =====================================================
        // ENTER KEY
        // =====================================================

        function setupCTW3RegistrationKeyboard() {


            const nameInput =
                document.getElementById(
                    "ctw3CountryName"
                );


            const flagInput =
                document.getElementById(
                    "ctw3CountryFlag"
                );


            const languageInput =
                document.getElementById(
                    "ctw3CountryLanguage"
                );


            if (nameInput) {

                nameInput.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            createCTW3Country();

                        }

                    }
                );

            }


            if (flagInput) {

                flagInput.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            createCTW3Country();

                        }

                    }
                );

            }


            if (languageInput) {

                languageInput.addEventListener(
                    "keydown",
                    function(event) {

                        if (
                            event.key ===
                            "Enter"
                        ) {

                            createCTW3Country();

                        }

                    }
                );

            }

        }


        // =====================================================
        // START CTW3
        // =====================================================

        window.addEventListener(
            "DOMContentLoaded",
            async function() {


                // -------------------------------------------------
                // INITIALIZE MAP
                // -------------------------------------------------

                initCTW3();


                // -------------------------------------------------
                // SETUP REGISTRATION
                // -------------------------------------------------

                setupCTW3RegistrationKeyboard();


                // -------------------------------------------------
                // LOAD COUNTRY
                // -------------------------------------------------

                await loadCTW3Country();

            }
        );

    </script>


</body>

</html>
