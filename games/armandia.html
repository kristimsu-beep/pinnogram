<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>Armandia Global Map & Roaming</title>
    <!-- Полный рабочий набор CDN импортов (Leaflet, Исправленный SweetAlert2, FontAwesome) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.0/sweetalert2.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.0/sweetalert2.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <script src="https://unpkg.com/three@0.128/build/three.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #000; user-select: none;
        }

        /* Панорамная карта */
        #map-container { 
            width: 100%; height: 100%; background: #000; 
            transform: perspective(1000px) rotateX(18deg) scale(1.2, 1.1);
            transform-origin: center bottom;
        }
        #map { width: 100%; height: 100%; background: #000; }

        /* Идеальный холст 3D-оверлея без завалов */
        #three-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 10;
        }

        /* 📱 ДВУХЗОННЫЙ ТАЧ-РАДАР СВАЙПОВ */
        #swipe-zone-settings {
            position: absolute; top: 0; left: 0; width: 100%; height: 35px; z-index: 210;
        }
        #swipe-zone-notifications {
            position: absolute; top: 35px; left: 0; width: 100%; height: 45px; z-index: 205;
        }

        /* ШТОРКА НАСТРОЕК (ЛИКВИД ГЛАСС) */
        #roaming-panel {
            position: absolute; top: -100%; left: 0; width: 100%; height: 260px;
            background: rgba(20, 20, 20, 0.4); backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-bottom: 1px solid rgba(255,255,255,0.12); z-index: 200;
            transition: top 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            color: #fff; box-sizing: border-box; padding: 20px;
            border-radius: 0 0 24px 24px;
        }
        #roaming-panel.panel-open { top: 0; }

        /* 📱 ШТОРКА ЦЕНТРА УВЕДОМЛЕНИЙ IOS-STYLE */
        #notification-center-panel {
            position: absolute; top: -100%; left: 0; width: 100%; height: 420px;
            background: rgba(15, 15, 15, 0.6); backdrop-filter: blur(30px) saturate(190%);
            -webkit-backdrop-filter: blur(30px) saturate(190%);
            border-bottom: 1px solid rgba(255,255,255,0.15); z-index: 195;
            transition: top 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.2s ease;
            color: #fff; box-sizing: border-box; padding: 20px;
            border-radius: 0 0 28px 24px; display: flex; flex-direction: column;
        }
        #notification-center-panel.panel-open { top: 0; }

        .notif-scroll-area {
            flex-grow: 1; overflow-y: auto; margin-top: 15px; padding-right: 5px;
        }
        .notif-scroll-area::-webkit-scrollbar { width: 3px; }
        .notif-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

        /* ПУЗЫРИ УВЕДОМЛЕНИЙ ВНУТРИ ШТОРКИ */
        .notif-item-container {
            position: relative; width: 100%; margin-bottom: 10px; overflow: hidden;
            border-radius: 16px; transition: max-height 0.4s ease, margin 0.4s ease, opacity 0.3s ease;
            max-height: 100px;
        }
        .notif-item {
            background: rgba(255,255,255,0.07); padding: 12px 16px; border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 12px;
            transform: translateX(0); transition: transform 0.2s ease; position: relative; z-index: 2;
        }
        .notif-delete-btn {
            position: absolute; right: 0; top: 0; height: 100%; width: 70px;
            background: #ff3b30; color: #fff; display: flex; justify-content: center;
            align-items: center; border-radius: 0 16px 16px 0; font-size: 14px; z-index: 1;
        }

        /* 🍏 ВСПЛЫВАЮЩИЙ IOS DYNAMIC ISLAND (ВВЕРХУ ЭКРАНА) */
        #dynamic-island-toast {
            position: absolute; top: -100px; left: 50%; transform: translateX(-50%);
            min-width: 180px; max-width: 90%; height: 35px; background: #000;
            border-radius: 20px; z-index: 300; display: flex; align-items: center;
            justify-content: center; padding: 0 15px; color: #fff; font-size: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow: hidden; font-weight: 500;
        }
        #dynamic-island-toast.island-active {
            top: 15px; height: 45px; border-radius: 22px;
        }

        /* 🗑️ НЕОНОВОЕ ВЕДРО УТИЛИЗАЦИИ TELEGRAM-STYLE */
        #telegram-trash-can {
            position: absolute; bottom: -100px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background: rgba(255, 59, 48, 0.2);
            border: 2px dashed #ff3b30; border-radius: 50%; z-index: 250;
            display: flex; justify-content: center; align-items: center; color: #ff3b30;
            font-size: 24px; box-shadow: 0 0 20px rgba(255,59,48,0.4);
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            opacity: 0; pointer-events: none;
        }
        #telegram-trash-can.trash-active { bottom: 30px; opacity: 1; }
        #telegram-trash-can.trash-hover { background: #ff3b30; color: #fff; scale: 1.15; box-shadow: 0 0 30px #ff3b30; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 15px 0; }
        .ios-switch { position: relative; display: inline-block; width: 46px; height: 26px; }
        .ios-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top:0; left:0; right:0; bottom:0; background: rgba(255,255,255,0.15); transition: .3s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 22px; width: 24px; left: 2px; bottom: 2px; background: #fff; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background: #34c759; }
        input:checked + .slider:before { transform: translateX(18px); }

        #network-status-indicator {
            position: absolute; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); padding: 8px 14px;
            border-radius: 12px; color: #fff; font-size: 11px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; gap: 6px;
        }
    </style>
</head>
<body>

    <!-- 📱 ДВУХЗОННЫЙ ТАЧ-РАДАР -->
    <div id="swipe-zone-settings"></div>
    <div id="swipe-zone-notifications"></div>

    <!-- 🍏 DYNAMIC ISLAND TOAST (ВСПЛЫВАЮЩИЙ ПУЗЫРЬ) -->
    <div id="dynamic-island-toast">
        <i class="fa-solid fa-satellite-dish" id="island-icon" style="margin-right: 8px; color: #00f2fe;"></i>
        <span id="island-text">Система активна</span>
    </div>

    <!-- ТВОЯ СТАРАЯ ШТОРКА НАСТРОЕК СВЯЗИ -->
    <div id="roaming-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
            <div style="font-weight:600; font-size:16px;"><i class="fa-solid fa-gear" style="color:#00f2fe;"></i> Настройки Связи Армандии</div>
            <div style="font-size:12px; opacity:0.5;" onclick="toggleSettings(false)"><i class="fa-solid fa-chevron-up"></i></div>
        </div>
        <div class="setting-row">
            <div>Включить связь<br><span style="font-size:11px; opacity:0.5;">Основное сотовое подключение</span></div>
            <label class="ios-switch"><input type="checkbox" id="toggle-signal" onchange="updateNetworkSettings()"><span class="slider"></span></label>
        </div>
        <div class="setting-row">
            <div>Собственный роуминг<br><span style="font-size:11px; opacity:0.5;">Автоматический суверенный шлюз</span></div>
            <label class="ios-switch"><input type="checkbox" id="toggle-roaming" onchange="updateNetworkSettings()"><span class="slider"></span></label>
        </div>
    </div>

    <!-- 📱 НОВАЯ ВТОРАЯ ШТОРКА: ЦЕНТРА УВЕДОМЛЕНИЙ IOS -->
    <div id="notification-center-panel">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid rgba(255,255,255,0.1); padding-bottom:8px;">
            <div style="font-weight:600; font-size:16px;"><i class="fa-solid fa-bell" style="color:#ff007f;"></i> Центр уведомлений iOS</div>
            <div style="font-size:11px; opacity:0.4;">Удерживай для очистки Telegram-Style</div>
        </div>
        
        <div class="notif-scroll-area" id="notifContainer">
            <!-- Сюда JS начнет инжектировать пузыри уведомлений -->
        </div>
    </div>

    <!-- ИНДИКАТОР СЕТИ -->
    <div id="network-status-indicator">
        <i class="fa-solid fa-signal" id="signal-icon" style="color:#ff007f;"></i>
        <span id="signal-text">Нет сети</span>
    </div>

    <!-- 🗑️ ВЕДРО TELEGRAM-STYLE -->
    <div id="telegram-trash-can"><i class="fa-solid fa-trash-can"></i></div>

    <!-- ПАНЕЛЬ КАРТЫ -->
    <div id="map-container">
        <div id="map"></div>
    </div>

    <!-- 3D НЕОНОВЫЙ ОВЕРЛЕЙ -->
    <canvas id="three-canvas"></canvas>

    <script>
        // 1. ИНИЦИАЛИЗАЦИЯ ПАНОРАМНОЙ КАРТЫ С МАКСИМАЛЬНЫМ ЗУМОМ
        // Центр в твоей точке: 52.775348, 49.690844
        const centerLat = 52.775348;
        const centerLng = 49.690844;
        
        // Leaflet-карта с максимальным уровнем зума 19
        const map = L.map('map', {
            center: [centerLat, centerLng],
            zoom: 19,
            maxZoom: 19,
            zoomControl: false,
            attributionControl: false
        });

        // Подключаем сочные спутниковые снимки
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // Координаты углов твоего суверенного государства Армандия
        const armandiaCoords = [
            [52.775487, 49.690799],
            [52.775396, 49.690508],
            [52.775656, 49.690236],
            [52.775774, 49.690600]
        ];

        // Рисуем невидимый Leaflet полигон для проверки пересечений
        const armandiaPolygon = L.polygon(armandiaCoords, {
            color: 'transparent',
            fillColor: 'transparent'
        }).addTo(map);

        // Метка пользователя на карте
        let userMarker = L.marker([centerLat, centerLng], {
            icon: L.divIcon({
                className: 'user-geo-pulse-icon',
                html: `<div style="width:16px; height:16px; background:#00f2fe; border:3px solid #fff; border-radius:50%; box-shadow:0 0 15px #00f2fe; animation: geoPulse 1.5s infinite;"></div>`
            })
        }).addTo(map);

        // Добавляем стиль пульсации метки в документ
        const style = document.createElement('style');
        style.innerHTML = `@keyframes geoPulse { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.4); opacity: 0; } }`;
        document.head.appendChild(style);

        // =====================================================================
        // 🔮 ОБЪЁМНАЯ 3D НЕОНОВАЯ СТЕНА ГРАНИЦЫ АРМАНДИИ (THREE.JS)
        // =====================================================================
        let scene, camera, renderer, borderGroup;

        function initThreeOverlay() {
            const canvas = document.getElementById('three-canvas');
            scene = new THREE.Scene();
            
            // 🎯 ИСПРАВЛЕНО: Возвращаем камеру строго в центр по оси X и Y, чтобы убрать кривой сдвиг границ
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 10); // Идеальный прямой взгляд сверху-вниз
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);

            // Создаем группу для всей границы
            borderGroup = new THREE.Group();
            scene.add(borderGroup);

            // 🎯 СУПЕР-МАТЕРИАЛ НЕОНОВОГО КУПОЛА: Полупрозрачный светящийся голубой неон
            const wallMaterial = new THREE.MeshBasicMaterial({
                color: 0x00f2fe,
                transparent: true,
                opacity: 0.25, // Полупрозрачный сочный щит
                side: THREE.DoubleSide,
                wireframe: false // Ставь true, если хочешь лазерную сетку!
            });

            // Высота нашей неоновой стены, взмывающей вверх (в 3D единицах)
            const wallHeight = 3.5; 

            // Генерируем 3D-стены между четырьмя GPS-углами Армандии
            for (let i = 0; i < armandiaCoords.length; i++) {
                let nextIdx = (i + 1) % armandiaCoords.length;

                // Переводим текущую и следующую GPS-точки в локальные 3D координаты пола
                let x1 = (armandiaCoords[i] - centerLng) * 8000;
                let y1 = (armandiaCoords[i] - centerLat) * 12000;

                let x2 = (armandiaCoords[nextIdx] - centerLng) * 8000;
                let y2 = (armandiaCoords[nextIdx] - centerLat) * 12000;

                // Строим вертикальную стену (из двух треугольников / Plane)
                const wallGeo = new THREE.BufferGeometry();
                
                // 🦾 Координаты 4-х вершин стены: две на земле (Z=0) и две взмывают ВВЕРХ в небо (Z=wallHeight)!
                const vertices = new Float32Array([
                    x1, y1, 0,           // Снизу 1
                    x2, y2, 0,           // Снизу 2
                    x1, y1, wallHeight,  // Сверху 1 (Взмыла вверх!)
                    
                    x2, y2, 0,           // Снизу 2
                    x2, y2, wallHeight,  // Сверху 2 (Взмыла вверх!)
                    x1, y1, wallHeight   // Сверху 1
                ]);

                wallGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                const wallMesh = new THREE.Mesh(wallGeo, wallMaterial);
                borderGroup.add(wallMesh);

                // Добавляем яркую неоновую линию-контур на самый верх стены для пущего эффекта
                const lineGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(x1, y1, wallHeight),
                    new THREE.Vector3(x2, y2, wallHeight)
                ]);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x00f2fe, transparent: true, opacity: 0.8 });
                const topLine = new THREE.Line(lineGeo, lineMat);
                borderGroup.add(topLine);
            }

            // 🎯 СИНХРОНИЗИРУЕМ НАКЛОН СЦЕНЫ С НАКЛОНОМ КАРТЫ (18 градусов)
            borderGroup.rotation.x = -18 * Math.PI / 180;

            animateThree();
        }

        function animateThree() {
            requestAnimationFrame(animateThree);
            if (borderGroup) {
                const center = map.getCenter();
                const zoom = map.getZoom();
                // 🎯 Масштаб теперь строго соответствует плоской карте 1:1
                const scale = Math.pow(2, zoom - 19); 

                // Двигаем и масштабируем всю 3D-систему стен за картой Leaflet
                borderGroup.position.x = (centerLng - center.lng) * 8000 * scale;
                borderGroup.position.y = (centerLat - center.lat) * 12000 * scale;
                borderGroup.scale.set(scale, scale, scale);
                
                // Плавное космическое дыхание/пульсация неонового силового щита
                borderGroup.children.forEach(mesh => {
                    if (mesh.material) {
                        mesh.material.opacity = mesh instanceof THREE.Mesh 
                            ? 0.25 + Math.sin(performance.now() * 0.003) * 0.08  
                            : 0.7 + Math.sin(performance.now() * 0.003) * 0.2;  
                    }
                });
            }
            renderer.render(scene, camera);
        }

        // =====================================================================
        // 🔀 МЕХАНИКА ЖИВОГО ПЕРЕСЕЧЕНИЯ ГРАНИЦЫ И ГЕОЛОКАЦИЯ
        // =====================================================================


        // =====================================================================
        // 📱 ДВИЖОК СВАЙПА IPHONE-STYLE ДЛЯ LIQUID GLASS ШТОРКИ
        // =====================================================================
        const panel = document.getElementById('roaming-panel');
        const triggerZone = document.getElementById('swipe-trigger-zone');
        let touchStartY = 0;
        let touchMoveY = 0;
        let isSwiping = false;

        // Перехватываем касание пальца вверху экрана
        triggerZone.addEventListener('touchstart', e => {
            touchStartY = e.touches[0].clientY;
            isSwiping = true;
        }, { passive: true });

        document.addEventListener('touchmove', e => {
            if (!isSwiping) return;
            touchMoveY = e.touches[0].clientY;
            let diffY = touchMoveY - touchStartY;
            
            // Если тянем палец вниз — принудительно выкатываем Liquid шторку
            if (diffY > 50) {
                togglePanel(true);
                isSwiping = false;
            }
        }, { passive: true });

        // Закрываем шторку свайпом обратно наверх внутри панели
        panel.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; isSwiping = true; }, { passive: true });
        panel.addEventListener('touchmove', e => {
            if (!isSwiping) return;
            touchMoveY = e.touches[0].clientY;
            if (touchStartY - touchMoveY > 50) {
                togglePanel(false);
                isSwiping = false;
            }
        }, { passive: true });

        function togglePanel(openFlag) {
            if (openFlag) panel.classList.add('panel-open');
            else panel.classList.remove('panel-open');
        }

        // =====================================================================
        // ⚙️ СИСТЕМА УПРАВЛЕНИЯ СВЯЗЬЮ И СЕТЕВЫМИ СТАТУСАМИ
        // =====================================================================
        function updateNetworkSettings() {
            const signalOn = document.getElementById('toggle-signal').checked;
            const roamingOn = document.getElementById('toggle-roaming').checked;
            const icon = document.getElementById('signal-icon');
            const text = document.getElementById('signal-text');

            if (!signalOn) {
                icon.className = "fa-solid fa-signal";
                icon.style.color = "#ff007f"; // Розовый — сеть полностью отключена
                text.innerText = "Нет сети";
            } else {
                if (roamingOn && insideArmandia) {
                    icon.className = "fa-solid fa-satellite-dish";
                    icon.style.color = "#34c759"; // Зеленый — суверенный роуминг Армандии активен!
                    text.innerText = "Armandia Roaming 5G";
                } else {
                    icon.className = "fa-solid fa-signal";
                    icon.style.color = "#00f2fe"; // Бирюзовый — стандартная вышка GeraGram
                    text.innerText = "GeraGram Network LTE";
                }
            }
        }
        // =====================================================================
        // 🍏 ФАБРИКА IOS DYNAMIC ISLAND И ЦЕНТРА УВЕДОМЛЕНИЙ
        // =====================================================================
        let insideArmandia = false;

        function pushiOSNotification(text, iconClass = "fa-bell", iconColor = "#00f2fe") {
            // 1. Анимация Dynamic Island всплывашки вверху экрана
            const island = document.getElementById('dynamic-island-toast');
            const isText = document.getElementById('island-text');
            const isIcon = document.getElementById('island-icon');

            if (isText && isIcon && island) {
                isText.innerText = text;
                isIcon.className = `fa-solid ${iconClass}`;
                isIcon.style.color = iconColor;

                island.classList.add('island-active');
                setTimeout(() => { island.classList.remove('island-active'); }, 3000);
            }

            // 2. Добавляем пузырь в Центр Уведомлений шторки
            const container = document.getElementById('notifContainer');
            if (!container) return;

            const itemWrap = document.createElement('div');
            itemWrap.className = 'notif-item-container';
            
            itemWrap.innerHTML = `
                <div class="notif-item">
                    <i class="fa-solid ${iconClass}" style="color:${iconColor}; font-size:16px;"></i>
                    <div style="font-size:13px; font-weight:500; color:#fff;">${text}</div>
                </div>
                <div class="notif-delete-btn" onclick="deleteSingleNotif(this)">Удалить</div>
            `;
            
            container.insertBefore(itemWrap, container.firstChild);
            initSwipeToDelete(itemWrap.querySelector('.notif-item'));
        }

        // Кинетический свайп влево для удаления отдельного уведомления
        function initSwipeToDelete(element) {
            if (!element) return;
            let startX = 0; let currentX = 0;
            element.addEventListener('touchstart', e => { startX = e.touches.clientX; }, {passive:true});
            element.addEventListener('touchmove', e => {
                currentX = e.touches.clientX;
                let diffX = currentX - startX;
                if (diffX < 0 && diffX > -80) element.style.transform = `translateX(${diffX}px)`;
            }, {passive:true});
            element.addEventListener('touchend', () => {
                let diffX = currentX - startX;
                if (diffX < -45) {
                    element.style.transform = 'translateX(-70px)';
                } else { element.style.transform = 'translateX(0)'; }
            });
        }

        function deleteSingleNotif(btnElement) {
            const container = btnElement.parentElement;
            if (!container) return;
            container.style.maxHeight = '0'; container.style.margin = '0'; container.style.opacity = '0';
            setTimeout(() => { container.remove(); }, 400);
        }
        // =====================================================================
        // 🛰️ РЕГИСТРАЦИЯ ПЕРЕСЕЧЕНИЙ И ТУМБЛЕРЫ СВЯЗИ
        // =====================================================================
        function checkGeoFence(lat, lng) {
            const x = lat, y = lng; let inside = false;
            for (let i = 0, j = armandiaCoords.length - 1; i < armandiaCoords.length; j = i++) {
                const xi = armandiaCoords[i][0], yi = armandiaCoords[i][1];
                const xj = armandiaCoords[j][0], yj = armandiaCoords[j][1];
                if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
            }

            if (inside !== insideArmandia) {
                insideArmandia = inside;
                if (insideArmandia) {
                    document.getElementById('toggle-roaming').checked = true; // Авто-включение роуминга
                    pushiOSNotification("Вход в воздушное пространство Армандии", "fa-passport", "#34c759");
                    updateNetworkSettings();
                } else {
                    document.getElementById('toggle-roaming').checked = false;
                    pushiOSNotification("Выход из пространства Армандии. Связь разорвана", "fa-door-open", "#ff3b30");
                    updateNetworkSettings();
                }
            }
        }

        function updateNetworkSettings() {
            const signalOn = document.getElementById('toggle-signal').checked;
            const roamingOn = document.getElementById('toggle-roaming').checked;
            const icon = document.getElementById('signal-icon'); const text = document.getElementById('signal-text');

            if (!icon || !text) return;

            if (!signalOn) {
                icon.className = "fa-solid fa-signal"; icon.style.color = "#ff007f"; text.innerText = "Нет сети";
            } else {
                if (roamingOn && insideArmandia) {
                    icon.className = "fa-solid fa-satellite-dish"; icon.style.color = "#34c759"; text.innerText = "Armandia Roaming 5G";
                } else {
                    icon.className = "fa-solid fa-signal"; icon.style.color = "#00f2fe"; text.innerText = "GeraGram LTE";
                }
            }
        }

        // Принудительные логи при кликах по тумблерам
        document.getElementById('toggle-signal').addEventListener('change', (e) => {
            pushiOSNotification(e.target.checked ? "Сотовая связь GeraGram включена" : "Авиарежим: связь отключена", "fa-tower-cell", "#00f2fe");
        });
        document.getElementById('toggle-roaming').addEventListener('change', (e) => {
            pushiOSNotification(e.target.checked ? "Роуминг Армандии взведен" : "Роуминг отключен пользователем", "fa-shield-dog", "#ff007f");
        });

        // Слежение по спутнику GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(p => {
                const lat = p.coords.latitude; const lng = p.coords.longitude;
                if (userMarker) userMarker.setLatLng([lat, lng]); 
                map.setView([lat, lng]);
                checkGeoFence(lat, lng);
            }, e => { console.log("GPS в симуляции."); checkGeoFence(centerLat, centerLng); }, { enableHighAccuracy: true });
        } else { checkGeoFence(centerLat, centerLng); }
        // =====================================================================
        // 📱 ДВУХЗОННЫЙ СВАЙП-ДВИЖОК И МАССОВАЯ ОЧИСТКА TELEGRAM-STYLE
        // =====================================================================
        const settingsPanel = document.getElementById('roaming-panel');
        const notifPanel = document.getElementById('notification-center-panel');
        const trashCan = document.getElementById('telegram-trash-can');
        
        let touchStartY = 0; let isSettingsDragging = false; let isNotifDragging = false;
        let pressTimer = null; let isLongPressing = false;

        // Зона 1: Шторка Настроек (Самый верх, 0-35px)
        const zoneSettings = document.getElementById('swipe-zone-settings');
        if (zoneSettings) {
            zoneSettings.addEventListener('touchstart', e => {
                touchStartY = e.touches.clientY; isSettingsDragging = true;
            }, {passive:true});
        }

        // Зона 2: Шторка Уведомлений (Чуть ниже, 35-80px)
        const zoneNotifs = document.getElementById('swipe-zone-notifications');
        if (zoneNotifs) {
            zoneNotifs.addEventListener('touchstart', e => {
                touchStartY = e.touches.clientY; isNotifDragging = true;
            }, {passive:true});
        }

        document.addEventListener('touchmove', e => {
            let currentY = e.touches.clientY;
            let diffY = currentY - touchStartY;

            if (isSettingsDragging && diffY > 40) { settingsPanel.classList.add('panel-open'); isSettingsDragging = false; }
            if (isNotifDragging && diffY > 40) { notifPanel.classList.add('panel-open'); isNotifDragging = false; }
            
            // Если шторка уведомлений удерживается для перетаскивания в ведро Telegram-Style!
            if (isLongPressing && notifPanel && notifPanel.classList.contains('panel-open')) {
                notifPanel.style.transition = 'none';
                notifPanel.style.transform = `translateY(${diffY}px) scale(0.95)`;
                
                // Проверяем наведение шторки на ведро снизу экрана
                if (currentY > window.innerHeight - 120) { trashCan.classList.add('trash-hover'); }
                else { trashCan.classList.remove('trash-hover'); }
            }
        }, {passive:false});

        document.addEventListener('touchend', e => {
            isSettingsDragging = false; isNotifDragging = false;
            clearTimeout(pressTimer);
            
            if (isLongPressing && notifPanel && trashCan) {
                isLongPressing = false;
                trashCan.classList.remove('trash-active');
                notifPanel.style.transition = 'top 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.2s ease';
                
                if (trashCan.classList.contains('trash-hover')) {
                    // 💥 УНИЧТОЖЕНИЕ TELEGRAM-STYLE: Все пузыри схлопываются в ноль и исчезают!
                    trashCan.classList.remove('trash-hover');
                    const items = document.querySelectorAll('.notif-item-container');
                    items.forEach((item, idx) => {
                        setTimeout(() => {
                            item.style.maxHeight = '0'; item.style.margin = '0'; item.style.opacity = '0';
                            setTimeout(() => { item.remove(); }, 400);
                        }, idx * 60);
                    });
                    pushiOSNotification("Уведомления очищены в Telegram-Style", "fa-trash-arrow-up", "#ff3b30");
                }
                notifPanel.style.transform = 'translateY(0) scale(1)';
            }
        });

        // Регистрация долгого удержания шторки уведомлений для вызова Ведра
        if (notifPanel) {
            notifPanel.addEventListener('touchstart', e => {
                touchStartY = e.touches.clientY;
                pressTimer = setTimeout(() => {
                    isLongPressing = true;
                    if (trashCan) trashCan.classList.add('trash-active');
                    if (navigator.vibrate) navigator.vibrate(40); // Мягкий тактильный отклик смартфона
                }, 1500); // 1.5 секунды для идеального отклика
            }, {passive:true});
        }

        function toggleSettings(f) { if(f) settingsPanel.classList.add('panel-open'); else settingsPanel.classList.remove('panel-open'); }
        
        window.addEventListener('resize', () => {
            if (camera && renderer) { camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }
        });

        // 🚀 ЗАПУСК СИСТЕМЫ ПРИ ЗАГРУЗКЕ
        initThreeOverlay();
        updateNetworkSettings();
        
        // Приветственный iOS пузырь через 1 секунду после входа
        setTimeout(() => { pushiOSNotification("Спутниковая система Армандии взведена", "fa-satellite", "#00f2fe"); }, 1000);
    </script>
</body>
</html>
