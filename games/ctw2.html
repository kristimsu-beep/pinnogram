<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>CTW 2: Conquer The World — Tactical Globe</title>

    <!-- 🗺️ 1. БАЗА КАРТ: Стили и скрипт самой карты Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 📐 2. ПЛАГИН РИСОВАНИЯ: Перевели на сверхстабильный CDN от Cloudflare! -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
    
    <!-- 🌟 3. ОКНА ОПОВЕЩЕНИЙ: Стили и скрипт логики SweetAlert2 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.0/sweetalert2.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.12.0/sweetalert2.all.min.js"></script>

    <!-- 🎨 4. ГРАФИКА: Шрифты иконок Font Awesome -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>


    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050814; color: #fff; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        /* 🗺️ ПОЛНОЭКРАННЫЙ ТАКТИЧЕСКИЙ РАДАР LEAFLET */
        #map {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            background: #b8d9e8 !important;
        }
        /* 🎛️ ХАЙ-ТЕК ТУМБЛЕР ПЕРЕКЛЮЧЕНИЯ РЕЖИМОВ КАРТЫ (APPLE-STYLE) */
        .map-mode-control {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; gap: 4px;
            background: rgba(10, 16, 32, 0.65); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(0, 242, 254, 0.2);
            padding: 4px; border-radius: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .mode-btn {
            background: transparent; border: none; color: rgba(255, 255, 255, 0.5);
            padding: 8px 18px; font-size: 12px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; border-radius: 20px; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex; align-items: center; gap: 8px;
        }
        .mode-btn:hover { color: #fff; }
        .mode-btn.btn-active {
            background: rgba(0, 242, 254, 0.15); color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
            border: 1px solid rgba(0, 242, 254, 0.3);
        }

        /* 📟 НЕОНОВЫЙ МЕТЕО-ЯРЛЫК ПРИ ЗАЖАТИИ ЭКРАНА (МЕТЕОЗОНД) */
        .weather-popup-neon .leaflet-popup-content-wrapper {
            background: rgba(7, 12, 28, 0.85) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid #00f2fe !important;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3) !important;
            color: #fff !important; border-radius: 12px !important;
            padding: 4px !important;
        }
        .weather-popup-neon .leaflet-popup-tip {
            background: rgba(7, 12, 28, 0.85) !important;
            border-left: 1px solid #00f2fe !important;
            border-bottom: 1px solid #00f2fe !important;
        }
        .weather-data-box { display: flex; flex-direction: column; gap: 6px; padding: 4px; font-size: 12px; }
        .weather-temp-val { font-size: 20px; font-weight: 800; color: #ff007f; text-shadow: 0 0 10px rgba(255,0,127,0.3); }

        /* 🦾 ИИ-МОДАЛКА СОЗДАНИЯ ИМПЕРИИ */
        .ctw2-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 5, 12, 0.7); backdrop-filter: blur(15px);
            z-index: 500; display: flex; justify-content: center; align-items: center;
            transition: opacity 0.4s ease;
        }
        .ctw2-modal {
            background: #0a0f1d; border: 1px solid #00f2fe; border-radius: 24px;
            width: 90%; max-width: 450px; padding: 30px; box-shadow: 0 0 40px rgba(0,242,254,0.15);
            display: flex; flex-direction: column; gap: 14px; box-sizing: border-box;
        }
        .ctw2-input {
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; padding: 12px 16px; color: #fff; font-size: 14px;
            outline: none; transition: all 0.3s;
        }
        .ctw2-input:focus { border-color: #00f2fe; box-shadow: 0 0 10px rgba(0,242,254,0.2); }
        
        .ctw2-btn {
            background: linear-gradient(45deg, #00f2fe, #4cd964); color: #050814;
            border: none; padding: 14px; font-size: 14px; font-weight: 800;
            border-radius: 12px; cursor: pointer; text-transform: uppercase;
            letter-spacing: 0.5px; box-shadow: 0 4px 15px rgba(0,242,254,0.2);
            transition: all 0.2s;
        }
        .ctw2-btn:active { transform: scale(0.98); }
        #map.weather-mode {
            background: #d9e7d5 !important;
        }
        
        #map.weather-mode .leaflet-tile-container {
            filter: brightness(0.9) saturate(0.75) contrast(0.95);
        }
        .weather-raster {
            image-rendering: auto !important;
            image-rendering: smooth !important;
        }
    </style>
</head>
<body>

    <!-- 🎛️ ХАЙ-ТЕК ТУМБЛЕР ПЕРЕКЛЮЧЕНИЯ РЕЖИМОВ КАРТЫ (APPLE-STYLE) -->
    <div class="map-mode-control">
        <button class="mode-btn btn-active" id="btn-mode-politic" onclick="switchMapMode('politic')">
            <i class="fa-solid fa-earth-americas"></i> Политическая
        </button>
        <button class="mode-btn" id="btn-mode-weather" onclick="switchMapMode('weather')">
            <i class="fa-solid fa-temperature-half"></i> Тепловой радар
        </button>
    </div>

    <!-- 🗺️ ПОЛНОЭКРАННЫЙ ТАКТИЧЕСКИЙ ХОЛСТ LEAFLET MAP -->
    <div id="map"></div>

    <!-- 🦾 ИИ-МОДАЛКА СОЗДАНИЯ ИМПЕРИИ (ПАСПОРТ ГОСУДАРСТВА) -->
    <div class="ctw2-modal-overlay" id="registerModal">
        <div class="ctw2-modal">
            <div style="font-weight: 900; font-size: 18px; color: #00f2fe; text-align: center; letter-spacing: 0.5px;">
                <i class="fa-solid fa-flag"></i> ОСНОВАНИЕ ГОСУДАРСТВА
            </div>
            <div style="font-size: 11px; color: rgba(255,255,255,0.4); text-align: center; margin-top: -6px;">
                Шаг 1: Заполните паспорт вашей будущей Империи
            </div>
            
            <input type="text" id="countryNameInput" class="ctw2-input" placeholder="Название страны (напр. Армандия)">
            <input type="text" id="countryLangInput" class="ctw2-input" placeholder="Официальный язык государства">
            <input type="text" id="countryFlagInput" class="ctw2-input" placeholder="Эмодзи-флаг или URL иконки (напр. 👑)">
            
            <button class="ctw2-btn" onclick="submitCountryPassportData()">Утвердить паспорт</button>
        </div>
    </div>
    <script>
        // =====================================================================
        // 🪐 1. ГЛОБАЛЬНЫЙ СЕТАП СЕССИИ И ИНИЦИАЛИЗАЦИЯ ТАКТИЧЕСКОЙ КАРТЫ
        // =====================================================================
        let map;
        let currentMapMode = 'politic'; // 'politic' или 'weather'
        let currentUser = localStorage.getItem('geraUsername') || 'Anonymous';
        
        let newCountryPassport = { name: "", lang: "", flag: "" };
        
        let baseTileLayer;
        let countriesGroupLayer;
        
        let drawControl;
        let drawnItems;

        // Авторизация по кукам сессии мессенджера GeraGram
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.startsWith('gera_user=') || cookie.startsWith('username=')) {
                currentUser = decodeURIComponent(cookie.substring(cookie.indexOf('=') + 1));
                localStorage.setItem('geraUsername', currentUser);
                break;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initTacticalGlobeMap();
        });
        function scheduleWeatherCanvasDraw() {
        
            if (
                !weatherCanvas ||
                !weatherSourceCanvas ||
                !weatherRasterBounds
            ) {
                return;
            }
        
            if (weatherDrawFrame) {
                return;
            }
        
            weatherDrawFrame = requestAnimationFrame(() => {
        
                weatherDrawFrame = 0;
        
                resizeWeatherCanvas();
                drawWeatherCanvas();
        
            });
        }
      
        function resizeWeatherCanvas() {
        
            if (!weatherCanvas || !map) {
                return;
            }
        
            const size = map.getSize();
        
            const dpr = Math.min(
                window.devicePixelRatio || 1,
                2
            );
        
            const width = Math.round(size.x * dpr);
            const height = Math.round(size.y * dpr);
        
            if (
                weatherCanvas.width !== width ||
                weatherCanvas.height !== height
            ) {
        
                weatherCanvas.width = width;
                weatherCanvas.height = height;
        
                weatherCanvas.style.width = size.x + 'px';
                weatherCanvas.style.height = size.y + 'px';
            }
        }
        
        
        function ensureWeatherCanvas() {
        
            if (weatherCanvas) {
                resizeWeatherCanvas();
                return;
            }
        
            weatherCanvas = document.createElement('canvas');
        
            weatherCanvas.id = 'weatherCanvas';
        
            weatherCanvas.style.position = 'absolute';
            weatherCanvas.style.left = '0';
            weatherCanvas.style.top = '0';
        
            weatherCanvas.style.width = '100%';
            weatherCanvas.style.height = '100%';
        
            weatherCanvas.style.pointerEvents = 'none';
        
            weatherCanvas.style.zIndex = '450';
        
            map.getContainer().appendChild(weatherCanvas);
        
            resizeWeatherCanvas();
        }
        
        
        function drawWeatherCanvas() {
        
            if (
                !weatherCanvas ||
                !weatherSourceCanvas ||
                !weatherRasterBounds ||
                !map
            ) {
                return;
            }
        
            const ctx =
                weatherCanvas.getContext('2d');
        
            const size =
                map.getSize();
        
            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );
        
            const canvasWidth =
                Math.round(size.x * dpr);
        
            const canvasHeight =
                Math.round(size.y * dpr);
        
            if (
                weatherCanvas.width !== canvasWidth ||
                weatherCanvas.height !== canvasHeight
            ) {
        
                weatherCanvas.width =
                    canvasWidth;
        
                weatherCanvas.height =
                    canvasHeight;
        
                weatherCanvas.style.width =
                    size.x + 'px';
        
                weatherCanvas.style.height =
                    size.y + 'px';
            }
        
            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        
            ctx.clearRect(
                0,
                0,
                size.x,
                size.y
            );
        
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        
        
            /*
             * =========================================================
             * ONE COMPLETE GLOBAL WEATHER WORLD
             * =========================================================
             *
             * The API raster is:
             *
             *      721 x 361
             *
             * covering:
             *
             *      -180 ... +180
             *       -90 ...  +90
             *
             * Therefore its geographic aspect ratio is exactly 2:1.
             *
             * We use Leaflet's projected longitude width for the
             * horizontal size and derive the vertical size from the
             * raster's 2:1 aspect ratio.
             */
        
            const zoom =
                map.getZoom();
        
            const worldWidth =
                map.project(
                    [0, 180],
                    zoom
                ).x -
                map.project(
                    [0, -180],
                    zoom
                ).x;
        
            const worldHeight =
                worldWidth *
                (
                    weatherSourceCanvas.height /
                    weatherSourceCanvas.width
                );
        
        
            /*
             * =========================================================
             * FIND THE SCREEN POSITION OF THE GLOBAL RASTER
             * =========================================================
             *
             * We anchor the raster at longitude -180.
             */
        
            const anchor =
                map.latLngToContainerPoint([
                    0,
                    -180
                ]);
        
            /*
             * Because the source raster is centered vertically
             * around latitude 0, calculate its top from the
             * map's latitude-0 screen position.
             */
        
            const centerY =
                map.latLngToContainerPoint([
                    0,
                    0
                ]).y;
        
            const top =
                centerY -
                worldHeight / 2;
        
        
            /*
             * =========================================================
             * ENDLESS HORIZONTAL COPIES
             * =========================================================
             */
        
            const left =
                anchor.x;
        
            const firstCopy =
                Math.floor(
                    -left / worldWidth
                ) - 1;
        
            const lastCopy =
                Math.ceil(
                    (size.x - left) /
                    worldWidth
                ) + 1;
        
        
            for (
                let copy = firstCopy;
                copy <= lastCopy;
                copy++
            ) {
        
                const x =
                    left +
                    copy * worldWidth;
        
                /*
                 * Skip completely invisible copies.
                 */
        
                if (
                    x + worldWidth <= 0 ||
                    x >= size.x
                ) {
                    continue;
                }
        
                /*
                 * Draw exactly one raster copy.
                 *
                 * No overlap.
                 */
        
                ctx.drawImage(
                    weatherSourceCanvas,
                    x,
                    top,
                    worldWidth,
                    worldHeight
                );
            }
        }
        
        
        function removeWeatherCanvas() {
        
            if (weatherDrawFrame) {
        
                cancelAnimationFrame(
                    weatherDrawFrame
                );
        
                weatherDrawFrame = 0;
            }
        
        
            if (weatherCanvas) {
        
                weatherCanvas.remove();
        
                weatherCanvas = null;
            }
        
        
            weatherSourceCanvas = null;
            weatherRasterBounds = null;
            weatherLoadedZoom = null;
        }
        function initTacticalGlobeMap() {
        
            map = L.map('map', {
                center: [30.0, 15.0],
                zoom: 2.5,
                minZoom: 2,
                maxZoom: 10,
                zoomControl: false,
                worldCopyJump: false,
                crs: L.CRS.EPSG3857
            });
            
            map.on('move', scheduleWeatherCanvasDraw);
            map.on('zoom', scheduleWeatherCanvasDraw);
            map.on('resize', scheduleWeatherCanvasDraw);
            
            baseTileLayer = L.tileLayer(
                'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                {
                    attribution: '© OpenStreetMap contributors'
                }
            ).addTo(map);
        
            countriesGroupLayer =
                L.layerGroup().addTo(map);
        
            drawnItems =
                new L.FeatureGroup();
        
            map.addLayer(drawnItems);
        
            drawControl =
                new L.Control.Draw({
                    edit: {
                        featureGroup: drawnItems,
                        edit: false,
                        remove: false
                    },
        
                    draw: {
                        polygon: {
                            allowIntersection: false,
        
                            shapeOptions: {
                                color: '#00f2fe',
                                fillColor: '#00f2fe',
                                fillOpacity: 0.2,
                                weight: 3
                            }
                        },
        
                        polyline: false,
                        circle: false,
                        rectangle: false,
                        marker: false,
                        circlemarker: false
                    }
                });
        
            // Weather sensor
            initWeatherPointSensor();
        
            // Political map
            loadGlobalEmpireMapData();
        
        }

        // =====================================================================
        // 📊 2. ВАЛИДАЦИЯ ПАСПОРТА ГОСУДАРСТВА
        // =====================================================================
        function submitCountryPassportData() {
            const name = document.getElementById('countryNameInput').value.trim();
            const lang = document.getElementById('countryLangInput').value.trim();
            const flag = document.getElementById('countryFlagInput').value.trim();

            if (!name || !lang || !flag) {
                Swal.fire({ title: "Внимание", text: "Все поля паспорта Империи должны быть заполнены!", icon: "warning", background: "#0a0f1d", color: "#fff" });
                return;
            }

            newCountryPassport = { name, lang, flag };
            document.getElementById('registerModal').style.display = 'none';
            
            Swal.fire({
                title: "Паспорт утвержден! 📐",
                text: "Теперь обведите границы вашей страны на глобусе с помощью неонового инструмента многоугольника в левом верхнем углу!",
                icon: "success", background: "#0a0f1d", color: "#fff", confirmButtonColor: "#00f2fe"
            });

            map.addControl(drawControl);
            new L.Draw.Polygon(map, drawControl.options.draw.polygon).enable();
        }

        // =====================================================================
        // 📡 3. АСИНХРОННЫЙ ПЕРЕХВАТ РИСОВАНИЯ И СВЯЗЬ С MONGODB ATLAS
        // =====================================================================
        window.addEventListener('DOMContentLoaded', () => {
            if (!map) return;
            
            map.on(L.Draw.Event.CREATED, async function (e) {
                const layer = e.layer;
                drawnItems.addLayer(layer);

                const latLngs = layer.getLatLngs();
                const cleanCoordsArray = latLngs.map(pt => [pt.lat, pt.lng]);

                const payload = {
                    username: currentUser,
                    name: newCountryPassport.name,
                    lang: newCountryPassport.lang,
                    flag: newCountryPassport.flag,
                    coordinates: cleanCoordsArray
                };

                try {
                    const response = await fetch('/api/ctw2/country/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (data.status === "success") {
                        Swal.fire({ title: "Триумф! 👑", text: data.message, icon: "success", background: "#0a0f1d", color: "#fff", confirmButtonColor: "#4cd964" });
                        map.removeControl(drawControl);
                        drawnItems.clearLayers();
                        loadGlobalEmpireMapData();
                    } else {
                        Swal.fire({ title: "Ошибка", text: data.message, icon: "error", background: "#0a0f1d", color: "#fff" });
                        drawnItems.clearLayers();
                    }
                } catch (err) {
                    console.error("Ошибка保存 империи в MongoDB:", err);
                    drawnItems.clearLayers();
                }
            });
        });

        async function loadGlobalEmpireMapData() {
            try {
                const response = await fetch('/api/ctw2/countries/list');
                const data = await response.json();

                if (data.status === "success") {
                    countriesGroupLayer.clearLayers();
                    let userHasCountry = false;

                    data.countries.forEach(country => {
                        if (country.username === currentUser) userHasCountry = true;

                        const polygon = L.polygon(country.coordinates, {
                            color: country.username === currentUser ? '#4cd964' : '#ff007f', 
                            fillColor: country.username === currentUser ? '#4cd964' : '#ff007f',
                            fillOpacity: 0.15, weight: country.username === currentUser ? 4 : 2
                        });

                        polygon.bindPopup(`
                            <div style="color:#fff; font-family:sans-serif; font-size:12px; padding:2px;">
                                <div style="font-size:16px; font-weight:bold; margin-bottom:4px;">${country.flag} ${country.name.toUpperCase()}</div>
                                <div><b>Правитель:</b> @${country.username}</div>
                                <div><b>Официальный язык:</b> ${country.lang}</div>
                            </div>
                        `, { className: 'weather-popup-neon' });

                        countriesGroupLayer.addLayer(polygon);
                    });

                    const modal = document.getElementById('registerModal');
                    if (modal) modal.style.display = userHasCountry ? 'none' : 'flex';
                }
            } catch (err) { console.error("Ошибка загрузки карты империй: ", err); }
        }


        // =====================================================================
        // 🌡️ 4. КЛИМАТИЧЕСКИЙ ДВИЖОК
        // =====================================================================
        
        let weatherCanvas = null;
        let weatherSourceCanvas = null;
        let weatherRasterBounds = null;
        
        let weatherRenderId = 0;
        let weatherRenderController = null;
        let weatherDrawFrame = 0;
        let weatherLoadedZoom = null;
        
        function getTemperatureColor(temp){
        
            const clampedTemp=
                Math.max(
                    -60,
                    Math.min(56,temp)
                );
        
            const stops=[
                {temp:-60,color:[35,0,120]},
                {temp:-50,color:[45,20,180]},
                {temp:-40,color:[30,80,230]},
                {temp:-30,color:[0,150,255]},
                {temp:-20,color:[0,200,220]},
                {temp:-10,color:[40,220,180]},
                {temp:0,color:[80,220,120]},
                {temp:10,color:[150,230,80]},
                {temp:20,color:[220,240,60]},
                {temp:30,color:[255,210,40]},
                {temp:35,color:[255,150,30]},
                {temp:40,color:[255,80,40]},
                {temp:45,color:[240,30,60]},
                {temp:50,color:[190,0,80]},
                {temp:56,color:[120,0,90]}
            ];
        
            if(clampedTemp<=stops[0].temp){
                return stops[0].color;
            }
        
            if(clampedTemp>=stops[stops.length-1].temp){
                return stops[stops.length-1].color;
            }
        
            for(let i=0;i<stops.length-1;i++){
        
                const t1=stops[i].temp;
                const t2=stops[i+1].temp;
        
                if(
                    clampedTemp>=t1 &&
                    clampedTemp<=t2
                ){
        
                    const f=
                        (clampedTemp-t1)/
                        (t2-t1);
        
                    return [
                        Math.round(
                            stops[i].color[0]+
                            (stops[i+1].color[0]-
                             stops[i].color[0])*f
                        ),
        
                        Math.round(
                            stops[i].color[1]+
                            (stops[i+1].color[1]-
                             stops[i].color[1])*f
                        ),
        
                        Math.round(
                            stops[i].color[2]+
                            (stops[i+1].color[2]-
                             stops[i].color[2])*f
                        )
                    ];
                }
            }
        
            return [80,220,120];
        }


        function createWeatherCanvas(data){
        
            const srcWidth = Number(data.width);
            const srcHeight = Number(data.height);
            const values = data.values;
        
            // Render the temperature field at higher resolution.
            // The actual temperatures are interpolated, not just the colors.
            const SCALE = 4;
        
            const width = srcWidth * SCALE;
            const height = srcHeight * SCALE;
        
            const canvas = document.createElement('canvas');
        
            canvas.width = width;
            canvas.height = height;
        
            const ctx = canvas.getContext('2d', {
                alpha: true
            });
        
            const imageData =
                ctx.createImageData(
                    width,
                    height
                );
        
            const pixels = imageData.data;
        
        
            // ---------------------------------------------------------
            // Safely read a temperature from the original grid
            // ---------------------------------------------------------
            function getValue(x, y){
        
                x = Math.max(
                    0,
                    Math.min(srcWidth - 1, x)
                );
        
                y = Math.max(
                    0,
                    Math.min(srcHeight - 1, y)
                );
        
                const value =
                    Number(values[y * srcWidth + x]);
        
                return Number.isFinite(value)
                    ? value
                    : null;
            }
        
        
            // ---------------------------------------------------------
            // Bilinear interpolation between the four surrounding
            // temperature values.
            // ---------------------------------------------------------
            function interpolateTemperature(x, y){
        
                const x0 = Math.floor(x);
                const y0 = Math.floor(y);
        
                const x1 =
                    Math.min(
                        x0 + 1,
                        srcWidth - 1
                    );
        
                const y1 =
                    Math.min(
                        y0 + 1,
                        srcHeight - 1
                    );
        
                const fx = x - x0;
                const fy = y - y0;
        
                const v00 = getValue(x0, y0);
                const v10 = getValue(x1, y0);
                const v01 = getValue(x0, y1);
                const v11 = getValue(x1, y1);
        
        
                // If the weather API contains missing values,
                // don't create strange interpolation around them.
                if(
                    v00 === null ||
                    v10 === null ||
                    v01 === null ||
                    v11 === null
                ){
                    return null;
                }
        
        
                const top =
                    v00 +
                    (v10 - v00) * fx;
        
                const bottom =
                    v01 +
                    (v11 - v01) * fx;
        
                return (
                    top +
                    (bottom - top) * fy
                );
            }
        
        
            // ---------------------------------------------------------
            // Draw the smooth temperature field
            // ---------------------------------------------------------
            for(let y = 0; y < height; y++){
        
                const sourceY =
                    y / SCALE;
        
        
                for(let x = 0; x < width; x++){
        
                    const sourceX =
                        x / SCALE;
        
        
                    const temp =
                        interpolateTemperature(
                            sourceX,
                            sourceY
                        );
        
        
                    const index =
                        (y * width + x) * 4;
        
        
                    // Missing temperature
                    if(temp === null){
        
                        pixels[index] = 0;
                        pixels[index + 1] = 0;
                        pixels[index + 2] = 0;
                        pixels[index + 3] = 0;
        
                        continue;
                    }
        
        
                    const color =
                        getTemperatureColor(temp);
        
        
                    pixels[index] =
                        color[0];
        
                    pixels[index + 1] =
                        color[1];
        
                    pixels[index + 2] =
                        color[2];
        
                    pixels[index + 3] = 255;
                }
            }
        
        
            ctx.putImageData(
                imageData,
                0,
                0
            );
        
        
            return canvas;
        }

        function normalizeWeatherBounds(bounds) {
        
            let south;
            let west;
            let north;
            let east;
        
        
            // Format:
            // [south, west, north, east]
            if (Array.isArray(bounds)) {
        
                // Format:
                // [[south, west], [north, east]]
                if (
                    Array.isArray(bounds[0]) &&
                    Array.isArray(bounds[1])
                ) {
        
                    south = Number(bounds[0][0]);
                    west  = Number(bounds[0][1]);
        
                    north = Number(bounds[1][0]);
                    east  = Number(bounds[1][1]);
        
                } else {
        
                    south = Number(bounds[0]);
                    west  = Number(bounds[1]);
                    north = Number(bounds[2]);
                    east  = Number(bounds[3]);
                }
            }
        
        
            // Object format
            else if (
                bounds &&
                typeof bounds === 'object'
            ) {
        
                // { southWest: {lat,lng}, northEast: {lat,lng} }
                if (
                    bounds.southWest &&
                    bounds.northEast
                ) {
        
                    south =
                        Number(bounds.southWest.lat);
        
                    west =
                        Number(bounds.southWest.lng);
        
                    north =
                        Number(bounds.northEast.lat);
        
                    east =
                        Number(bounds.northEast.lng);
                }
        
        
                // Leaflet-style private names
                else if (
                    bounds._southWest &&
                    bounds._northEast
                ) {
        
                    south =
                        Number(bounds._southWest.lat);
        
                    west =
                        Number(bounds._southWest.lng);
        
                    north =
                        Number(bounds._northEast.lat);
        
                    east =
                        Number(bounds._northEast.lng);
                }
        
        
                // Normal object properties
                else {
        
                    south = Number(
                        bounds.south ??
                        bounds.minLat ??
                        bounds.latMin
                    );
        
                    west = Number(
                        bounds.west ??
                        bounds.minLng ??
                        bounds.lngMin ??
                        bounds.lonMin
                    );
        
                    north = Number(
                        bounds.north ??
                        bounds.maxLat ??
                        bounds.latMax
                    );
        
                    east = Number(
                        bounds.east ??
                        bounds.maxLng ??
                        bounds.lngMax ??
                        bounds.lonMax
                    );
                }
            }
        
        
            // Make sure all four values are valid.
            if (
                !Number.isFinite(south) ||
                !Number.isFinite(west) ||
                !Number.isFinite(north) ||
                !Number.isFinite(east)
            ) {
        
                console.error(
                    'Invalid weather bounds:',
                    bounds
                );
        
                return null;
            }
        
        
            // Handle a raster crossing the 180° meridian.
            if (east < west) {
                east += 360;
            }
        
        
            return {
                south: south,
                west: west,
                north: north,
                east: east
            };
        }

        async function renderGlobalWeatherHeatGrid() {
        
            const renderId = ++weatherRenderId;
        
            // Cancel any previous weather request.
            if (weatherRenderController) {
                weatherRenderController.abort();
            }
        
            weatherRenderController = new AbortController();
        
            try {
        
                const response = await fetch('/api/ctw2/weather/map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        zoom: map.getZoom()
                    }),
                    signal: weatherRenderController.signal
                });
        
        
                if (!response.ok) {
                    throw new Error(
                        `Weather API HTTP ${response.status}`
                    );
                }
        
        
                const data = await response.json();
                
                console.log(
                    '🌡️ WEATHER DATA:',
                    {
                        bounds: data.bounds,
                        width: data.width,
                        height: data.height
                    }
                );
                        
        
                // Ignore an old request that finished late.
                if (renderId !== weatherRenderId) {
                    return;
                }
        
        
                if (
                    !data ||
                    data.status !== 'success' ||
                    !data.bounds ||
                    !Array.isArray(data.values)
                ) {
                    throw new Error(
                        'Invalid weather raster data'
                    );
                }
        
        
                const width = Number(data.width);
                const height = Number(data.height);
        
        
                if (
                    !Number.isFinite(width) ||
                    !Number.isFinite(height) ||
                    width <= 0 ||
                    height <= 0
                ) {
                    throw new Error(
                        'Invalid weather raster dimensions'
                    );
                }
        
        
                if (
                    data.values.length <
                    width * height
                ) {
                    throw new Error(
                        'Weather raster contains too few values'
                    );
                }
        
        
                /*
                 * Convert the API bounds into:
                 *
                 * south
                 * west
                 * north
                 * east
                 */
                const bounds = normalizeWeatherBounds(
                    data.bounds
                );
        
        
                if (!bounds) {
                    throw new Error(
                        'Could not understand weather bounds'
                    );
                }
        
        
                /*
                 * Create the temperature raster once.
                 *
                 * This is kept separately from the visible
                 * canvas so we can draw it repeatedly without
                 * creating multiple Leaflet ImageOverlays.
                 */
                weatherSourceCanvas =
                    createWeatherCanvas(data);
        
        
                weatherRasterBounds = bounds;
        
        
                weatherLoadedZoom =
                    map.getZoom();
        
        
                /*
                 * Create our single visible weather canvas.
                 */
                ensureWeatherCanvas();
        
        
                /*
                 * Draw immediately.
                 */
                resizeWeatherCanvas();
                drawWeatherCanvas();
        
        
            } catch (error) {
        
                /*
                 * Abort is normal when another weather request
                 * replaces this one.
                 */
                if (
                    error &&
                    error.name === 'AbortError'
                ) {
                    return;
                }
        
        
                console.error(
                    'Weather raster error:',
                    error
                );
            }
        }

        function drawWeatherCanvas() {
        
            if (
                !weatherCanvas ||
                !weatherSourceCanvas ||
                !weatherRasterBounds ||
                !map
            ) {
                return;
            }
        
            const ctx = weatherCanvas.getContext('2d');
        
            const size = map.getSize();
        
            const dpr = Math.min(
                window.devicePixelRatio || 1,
                2
            );
        
            // Make sure the canvas has the correct resolution.
            const canvasWidth = Math.round(size.x * dpr);
            const canvasHeight = Math.round(size.y * dpr);
        
            if (
                weatherCanvas.width !== canvasWidth ||
                weatherCanvas.height !== canvasHeight
            ) {
                weatherCanvas.width = canvasWidth;
                weatherCanvas.height = canvasHeight;
        
                weatherCanvas.style.width = size.x + 'px';
                weatherCanvas.style.height = size.y + 'px';
            }
        
            // Work in normal screen pixels.
            ctx.setTransform(
                dpr,
                0,
                0,
                dpr,
                0,
                0
            );
        
            ctx.clearRect(
                0,
                0,
                size.x,
                size.y
            );
        
            // Smooth the temperature raster.
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';
        
        
            const bounds = weatherRasterBounds;
        
            const zoom = map.getZoom();
        
        
            /*
             * One complete world is 360 degrees.
             * At Web Mercator zoom Z, its width is:
             */
            const worldWidth =
                256 * Math.pow(2, zoom);
        
        
            /*
             * Calculate how many copies are necessary
             * to cover the screen.
             *
             * We create extra copies on both sides so
             * dragging never exposes an empty area.
             */
            const copies =
                Math.ceil(size.x / worldWidth) + 2;
        
        
            const centerLng =
                map.getCenter().lng;
        
        
            /*
             * Find the world copy closest to the map center.
             */
            const centerWorld =
                Math.floor(
                    (centerLng - bounds.west) / 360
                );
        
        
            for (
                let i = -copies;
                i <= copies;
                i++
            ) {
        
                const world =
                    centerWorld + i;
        
        
                /*
                 * Move this copy exactly 360 degrees
                 * east/west from the original raster.
                 */
                const west =
                    bounds.west + world * 360;
        
                const east =
                    bounds.east + world * 360;
        
        
                /*
                 * Convert geographic coordinates
                 * to screen coordinates.
                 */
                const topLeft =
                    map.latLngToContainerPoint([
                        bounds.north,
                        west
                    ]);
        
                const bottomRight =
                    map.latLngToContainerPoint([
                        bounds.south,
                        east
                    ]);
        
        
                const x =
                    topLeft.x;
        
                const y =
                    topLeft.y;
        
                const width =
                    bottomRight.x - topLeft.x;
        
                const height =
                    bottomRight.y - topLeft.y;
        
        
                /*
                 * Skip copies that are completely
                 * outside the visible screen.
                 */
                if (
                    x + width < 0 ||
                    x > size.x ||
                    y + height < 0 ||
                    y > size.y
                ) {
                    continue;
                }
        
        
                /*
                 * Draw the temperature raster.
                 *
                 * Unlike L.imageOverlay, this does NOT
                 * create separate Leaflet layers.
                 */
                ctx.drawImage(
                    weatherSourceCanvas,
                    x,
                    y,
                    width,
                    height
                );
            }
        }

        async function switchMapMode(mode) {
        
            currentMapMode = mode;
        
        
            document
                .getElementById('btn-mode-politic')
                .classList
                .toggle(
                    'btn-active',
                    mode === 'politic'
                );
        
        
            document
                .getElementById('btn-mode-weather')
                .classList
                .toggle(
                    'btn-active',
                    mode === 'weather'
                );
        
        
            /*
             * Invalidate any previous weather request.
             */
            weatherRenderId++;
        
        
            if (weatherRenderController) {
        
                weatherRenderController.abort();
        
                weatherRenderController = null;
            }
        
        
            /*
             * POLITICAL MODE
             */
            if (mode === 'politic') {
        
                /*
                 * Remove the new canvas weather layer.
                 */
                removeWeatherCanvas();
        
        
                /*
                 * Show political countries.
                 */
                if (
                    !map.hasLayer(
                        countriesGroupLayer
                    )
                ) {
        
                    map.addLayer(
                        countriesGroupLayer
                    );
                }
        
                return;
            }
        
        
            /*
             * WEATHER MODE
             */
            if (mode === 'weather') {
        
                /*
                 * Hide political countries.
                 */
                if (
                    map.hasLayer(
                        countriesGroupLayer
                    )
                ) {
        
                    map.removeLayer(
                        countriesGroupLayer
                    );
                }
        
        
                /*
                 * Load the weather raster.
                 */
                await renderGlobalWeatherHeatGrid();
            }
        }
        // НЕУБИВАЕМЫЙ МЕТЕОЗОНД (ИСПРАВЛЕНО: ЯРЛЫК ТЕПЕРЬ СТРЕЛЯЕТ С ПЕРВОГО КЛИКА)
        function initWeatherPointSensor() {
            map.on('click', async function (e) {
                // Если мы в политическом режиме — выходим, чтобы не мешать кликать по странам
                if (currentMapMode !== 'weather') return;

                const gpsCoords = e.latlng;
                if (navigator.vibrate) navigator.vibrate(30);

                Swal.fire({
                    title: "Зондирование...",
                    text: `Запрос климата: [${gpsCoords.lat.toFixed(2)}, ${gpsCoords.lng.toFixed(2)}]`,
                    icon: "success", background: "#0a0f1d", color: "#fff",
                    showConfirmButton: false, allowOutsideClick: false,
                    didOpen: () => { Swal.showLoading(); }
                });

                try {
                    const url = `/api/ctw2/weather/point?lat=${gpsCoords.lat}&lng=${gpsCoords.lng}`;
                    const response = await fetch(url);
                    const resData = await response.json();

                    // 🎯 КРИТИЧЕСКИЙ ФИКС: Принудительно закрываем окно лоадера, 
                    // чтобы освободить экран для всплывающего ярлыка Leaflet!
                    Swal.close();

                    if (resData.status === "success" || resData.temp !== undefined) {
                        // Выкидываем неоновый метео-паспорт прямо над точкой клика
                        L.popup({ className: 'weather-popup-neon', offset: [0, -5], closeOnClick: true })
                            .setLatLng(gpsCoords)
                            .setContent(`
                                <div class="weather-data-box">
                                    <div style="font-weight:900; color:#00f2fe; text-transform:uppercase; font-size:10px; letter-spacing:0.5px;"><i class="fa-solid fa-satellite-dish"></i> МЕТЕОЗОНД CTW 2</div>
                                    <div style="margin: 2px 0; color:rgba(255,255,255,0.6); font-size:11px;"><b>GPS:</b> ${gpsCoords.lat.toFixed(2)}, ${gpsCoords.lng.toFixed(2)}</div>
                                    <div><b>Температура:</b> <span class="weather-temp-val">${resData.temp}°C</span></div>
                                    <div><b>Ветер:</b> ${resData.windspeed || 4.2} км/ч</div>
                                </div>
                            `)
                            .openOn(map);
                    }
                } catch (err) {
                    Swal.close();
                    console.error("Ошибка точечного сканирования погоды: ", err);
                }
            });
        }

    </script>
