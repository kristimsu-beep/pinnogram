        function getTemperatureColor(temp){
        
            const clampedTemp=
                Math.max(
                    -60,
                    Math.min(56,temp)
                );
        
            const stops=[
                {temp:-60,color:[35,0,120]},
                {temp:-50,color:[45,20,180]},
                {temp:-40,color:[30,80,230]},
                {temp:-30,color:[0,150,255]},
                {temp:-20,color:[0,200,220]},
                {temp:-10,color:[40,220,180]},
                {temp:0,color:[80,220,120]},
                {temp:10,color:[150,230,80]},
                {temp:20,color:[220,240,60]},
                {temp:30,color:[255,210,40]},
                {temp:35,color:[255,150,30]},
                {temp:40,color:[255,80,40]},
                {temp:45,color:[240,30,60]},
                {temp:50,color:[190,0,80]},
                {temp:56,color:[120,0,90]}
            ];
        
            if(clampedTemp<=stops[0].temp){
                return stops[0].color;
            }
        
            if(clampedTemp>=stops[stops.length-1].temp){
                return stops[stops.length-1].color;
            }
        
            for(let i=0;i<stops.length-1;i++){
        
                const t1=stops[i].temp;
                const t2=stops[i+1].temp;
        
                if(
                    clampedTemp>=t1 &&
                    clampedTemp<=t2
                ){
        
                    const f=
                        (clampedTemp-t1)/
                        (t2-t1);
        
                    return [
                        Math.round(
                            stops[i].color[0]+
                            (stops[i+1].color[0]-
                             stops[i].color[0])*f
                        ),
        
                        Math.round(
                            stops[i].color[1]+
                            (stops[i+1].color[1]-
                             stops[i].color[1])*f
                        ),
        
                        Math.round(
                            stops[i].color[2]+
                            (stops[i+1].color[2]-
                             stops[i].color[2])*f
                        )
                    ];
                }
            }
        
            return [80,220,120];
        }


        function createWeatherCanvas(data){
        
            const srcWidth = Number(data.width);
            const srcHeight = Number(data.height);
            const values = data.values;
        
            const SCALE = 4;
        
            /*
             * 721 samples represent 720 longitude intervals.
             * 361 samples represent 360 latitude intervals.
             *
             * Therefore the visual canvas represents exactly:
             *
             *      360° × 180°
             *
             * without stretching the duplicate edge pixel.
             */
        
            const width =
                (srcWidth - 1) * SCALE;
        
            const height =
                (srcHeight - 1) * SCALE;
        
            const canvas =
                document.createElement('canvas');
        
            canvas.width = width;
            canvas.height = height;
        
            const ctx =
                canvas.getContext('2d', {
                    alpha: true
                });
        
            const imageData =
                ctx.createImageData(
                    width,
                    height
                );
        
            const pixels =
                imageData.data;
        
        
            function getValue(x, y){
        
                x =
                    Math.max(
                        0,
                        Math.min(
                            srcWidth - 1,
                            x
                        )
                    );
        
                y =
                    Math.max(
                        0,
                        Math.min(
                            srcHeight - 1,
                            y
                        )
                    );
        
                const value =
                    Number(
                        values[
                            y * srcWidth + x
                        ]
                    );
        
                return Number.isFinite(value)
                    ? value
                    : null;
            }
        
        
            function interpolateTemperature(x, y){
        
                const x0 =
                    Math.floor(x);
        
                const y0 =
                    Math.floor(y);
        
                const x1 =
                    Math.min(
                        x0 + 1,
                        srcWidth - 1
                    );
        
                const y1 =
                    Math.min(
                        y0 + 1,
                        srcHeight - 1
                    );
        
                const fx =
                    x - x0;
        
                const fy =
                    y - y0;
        
                const v00 =
                    getValue(x0, y0);
        
                const v10 =
                    getValue(x1, y0);
        
                const v01 =
                    getValue(x0, y1);
        
                const v11 =
                    getValue(x1, y1);
        
        
                if(
                    v00 === null ||
                    v10 === null ||
                    v01 === null ||
                    v11 === null
                ){
                    return null;
                }
        
        
                const top =
                    v00 +
                    (v10 - v00) * fx;
        
                const bottom =
                    v01 +
                    (v11 - v01) * fx;
        
        
                return (
                    top +
                    (bottom - top) * fy
                );
            }
        
        
            for(
                let y = 0;
                y < height;
                y++
            ){
        
                const sourceY =
                    y / SCALE;
        
        
                for(
                    let x = 0;
                    x < width;
                    x++
                ){
        
                    const sourceX =
                        x / SCALE;
        
        
                    const temp =
                        interpolateTemperature(
                            sourceX,
                            sourceY
                        );
        
        
                    const index =
                        (y * width + x) * 4;
        
        
                    if(temp === null){
        
                        pixels[index] = 0;
                        pixels[index + 1] = 0;
                        pixels[index + 2] = 0;
                        pixels[index + 3] = 0;
        
                        continue;
                    }
        
        
                    const color =
                        getTemperatureColor(temp);
        
        
                    pixels[index] =
                        color[0];
        
                    pixels[index + 1] =
                        color[1];
        
                    pixels[index + 2] =
                        color[2];
        
                    pixels[index + 3] =
                        195;
                }
            }
        
        
            ctx.putImageData(
                imageData,
                0,
                0
            );
        
        
            return canvas;
        }

        function normalizeWeatherBounds(bounds) {
        
            let south;
            let west;
            let north;
            let east;
        
        
            // Format:
            // [south, west, north, east]
            if (Array.isArray(bounds)) {
        
                // Format:
                // [[south, west], [north, east]]
                if (
                    Array.isArray(bounds[0]) &&
                    Array.isArray(bounds[1])
                ) {
        
                    south = Number(bounds[0][0]);
                    west  = Number(bounds[0][1]);
        
                    north = Number(bounds[1][0]);
                    east  = Number(bounds[1][1]);
        
                } else {
        
                    south = Number(bounds[0]);
                    west  = Number(bounds[1]);
                    north = Number(bounds[2]);
                    east  = Number(bounds[3]);
                }
            }
        
        
            // Object format
            else if (
                bounds &&
                typeof bounds === 'object'
            ) {
        
                // { southWest: {lat,lng}, northEast: {lat,lng} }
                if (
                    bounds.southWest &&
                    bounds.northEast
                ) {
        
                    south =
                        Number(bounds.southWest.lat);
        
                    west =
                        Number(bounds.southWest.lng);
        
                    north =
                        Number(bounds.northEast.lat);
        
                    east =
                        Number(bounds.northEast.lng);
                }
        
        
                // Leaflet-style private names
                else if (
                    bounds._southWest &&
                    bounds._northEast
                ) {
        
                    south =
                        Number(bounds._southWest.lat);
        
                    west =
                        Number(bounds._southWest.lng);
        
                    north =
                        Number(bounds._northEast.lat);
        
                    east =
                        Number(bounds._northEast.lng);
                }
        
        
                // Normal object properties
                else {
        
                    south = Number(
                        bounds.south ??
                        bounds.minLat ??
                        bounds.latMin
                    );
        
                    west = Number(
                        bounds.west ??
                        bounds.minLng ??
                        bounds.lngMin ??
                        bounds.lonMin
                    );
        
                    north = Number(
                        bounds.north ??
                        bounds.maxLat ??
                        bounds.latMax
                    );
        
                    east = Number(
                        bounds.east ??
                        bounds.maxLng ??
                        bounds.lngMax ??
                        bounds.lonMax
                    );
                }
            }
        
        
            // Make sure all four values are valid.
            if (
                !Number.isFinite(south) ||
                !Number.isFinite(west) ||
                !Number.isFinite(north) ||
                !Number.isFinite(east)
            ) {
        
                console.error(
                    'Invalid weather bounds:',
                    bounds
                );
        
                return null;
            }
        
        
            // Handle a raster crossing the 180° meridian.
            if (east < west) {
                east += 360;
            }
        
        
            return {
                south: south,
                west: west,
                north: north,
                east: east
            };
        }

        async function renderGlobalWeatherHeatGrid() {
        
            const renderId = ++weatherRenderId;
        
            // Cancel any previous weather request.
            if (weatherRenderController) {
                weatherRenderController.abort();
            }
        
            weatherRenderController = new AbortController();
        
            try {
        
                const response = await fetch('/api/ctw2/weather/map', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        zoom: map.getZoom()
                    }),
                    signal: weatherRenderController.signal
                });
        
        
                if (!response.ok) {
                    throw new Error(
                        `Weather API HTTP ${response.status}`
                    );
                }
        
        
                const data = await response.json();
                
                console.log(
                    '🌡️ WEATHER DATA:',
                    {
                        bounds: data.bounds,
                        width: data.width,
                        height: data.height
                    }
                );
                        
        
                // Ignore an old request that finished late.
                if (renderId !== weatherRenderId) {
                    return;
                }
        
        
                if (
                    !data ||
                    data.status !== 'success' ||
                    !data.bounds ||
                    !Array.isArray(data.values)
                ) {
                    throw new Error(
                        'Invalid weather raster data'
                    );
                }
        
        
                const width = Number(data.width);
                const height = Number(data.height);
        
        
                if (
                    !Number.isFinite(width) ||
                    !Number.isFinite(height) ||
                    width <= 0 ||
                    height <= 0
                ) {
                    throw new Error(
                        'Invalid weather raster dimensions'
                    );
                }
        
        
                if (
                    data.values.length <
                    width * height
                ) {
                    throw new Error(
                        'Weather raster contains too few values'
                    );
                }
        
        
                /*
                 * Convert the API bounds into:
                 *
                 * south
                 * west
                 * north
                 * east
                 */
                const bounds = normalizeWeatherBounds(
                    data.bounds
                );
        
        
                if (!bounds) {
                    throw new Error(
                        'Could not understand weather bounds'
                    );
                }
        
        
                /*
                 * Create the temperature raster once.
                 *
                 * This is kept separately from the visible
                 * canvas so we can draw it repeatedly without
                 * creating multiple Leaflet ImageOverlays.
                 */
                weatherRasterBounds = bounds;
                
                ensureWeatherCanvas();
                
                uploadWeatherTexture(data);
                
                resizeWeatherCanvas();
                
                drawWeatherCanvas();
        
        
            } catch (error) {
        
                /*
                 * Abort is normal when another weather request
                 * replaces this one.
                 */
                if (
                    error &&
                    error.name === 'AbortError'
                ) {
                    return;
                }
        
        
                console.error(
                    'Weather raster error:',
                    error
                );
            }
        }

        function drawWeatherCanvas() {
        
            if (
                !weatherCanvas ||
                !weatherGL ||
                !weatherGLProgram ||
                !weatherGLTexture ||
                !map ||
                !weatherRasterBounds
            ) {
                return;
            }
        
        
            resizeWeatherCanvas();
        
        
            const gl = weatherGL;
        
            const size =
                map.getSize();
        
        
            const dpr =
                Math.min(
                    window.devicePixelRatio || 1,
                    2
                );
        
        
            gl.viewport(
                0,
                0,
                weatherCanvas.width,
                weatherCanvas.height
            );
        
        
            gl.clearColor(
                0,
                0,
                0,
                0
            );
        
            gl.clear(
                gl.COLOR_BUFFER_BIT
            );
        
        
            gl.useProgram(
                weatherGLProgram
            );
        
        
            gl.activeTexture(
                gl.TEXTURE0
            );
        
            gl.bindTexture(
                gl.TEXTURE_2D,
                weatherGLTexture
            );
        
        
            const zoom =
                map.getZoom();
        
        
            const worldSize =
                256 *
                Math.pow(
                    2,
                    zoom
                );
        
        
            /*
             * This is the critical part:
             *
             * Leaflet's projected center is used directly.
             *
             * We do NOT calculate lat/lng for every pixel.
             */
        
            const center =
                map.project(
                    map.getCenter(),
                    zoom
                );
        
        
            const uniforms = {
        
                canvasSize:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_canvasSize'
                    ),
        
                dpr:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_dpr'
                    ),
        
                worldSize:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_worldSize'
                    ),
        
                centerWorld:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_centerWorld'
                    ),
        
                west:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_west'
                    ),
        
                east:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_east'
                    ),
        
                north:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_north'
                    ),
        
                south:
                    gl.getUniformLocation(
                        weatherGLProgram,
                        'u_south'
                    )
            };
        
        
            gl.uniform2f(
                uniforms.canvasSize,
                size.x,
                size.y
            );
        
        
            gl.uniform1f(
                uniforms.dpr,
                dpr
            );
        
        
            gl.uniform1f(
                uniforms.worldSize,
                worldSize
            );
        
        
            gl.uniform2f(
                uniforms.centerWorld,
                center.x,
                center.y
            );
        
        
            gl.uniform1f(
                uniforms.west,
                weatherRasterBounds.west
            );
        
        
            gl.uniform1f(
                uniforms.east,
                weatherRasterBounds.east
            );
        
        
            gl.uniform1f(
                uniforms.north,
                weatherRasterBounds.north
            );
        
        
            gl.uniform1f(
                uniforms.south,
                weatherRasterBounds.south
            );
        
        
            gl.uniform1i(
                gl.getUniformLocation(
                    weatherGLProgram,
                    'u_temperature'
                ),
                0
            );
        
        
            gl.drawArrays(
                gl.TRIANGLES,
                0,
                6
            );
        }

        async function switchMapMode(mode) {
        
            currentMapMode = mode;
        
        
            document
                .getElementById('btn-mode-politic')
                .classList
                .toggle(
                    'btn-active',
                    mode === 'politic'
                );
        
        
            document
                .getElementById('btn-mode-weather')
                .classList
                .toggle(
                    'btn-active',
                    mode === 'weather'
                );
        
        
            document
                .getElementById('btn-mode-satellite')
                .classList
                .toggle(
                    'btn-active',
                    mode === 'satellite'
                );
        
        
            /*
             * If we are leaving Satellite mode,
             * completely remove the NOAA satellite image
             * and stop its automatic refresh.
             */
            if (mode !== 'satellite') {
        
                removeSatelliteLayer();
        
            }
        
        
            /*
             * Invalidate any previous weather request.
             */
            weatherRenderId++;
        
        
            if (weatherRenderController) {
        
                weatherRenderController.abort();
        
                weatherRenderController = null;
            }
        
        
            /*
             * POLITICAL MODE
             */
            if (mode === 'politic') {
        
                /*
                 * Remove the weather layer.
                 */
                removeWeatherCanvas();
        
        
                /*
                 * Show political countries.
                 */
                if (
                    !map.hasLayer(
                        countriesGroupLayer
                    )
                ) {
        
                    map.addLayer(
                        countriesGroupLayer
                    );
                }
        
                return;
            }
        
        
            /*
             * WEATHER MODE
             */
            if (mode === 'weather') {
        
                /*
                 * Hide political countries.
                 */
                if (
                    map.hasLayer(
                        countriesGroupLayer
                    )
                ) {
        
                    map.removeLayer(
                        countriesGroupLayer
                    );
                }
        
        
                /*
                 * Load the weather raster.
                 */
                await renderGlobalWeatherHeatGrid();
        
                return;
            }
        
        
            /*
             * SATELLITE MODE
             */
            if (mode === 'satellite') {
            
                removeWeatherCanvas();
            
                if (
                    map.hasLayer(
                        countriesGroupLayer
                    )
                ) {
                    map.removeLayer(
                        countriesGroupLayer
                    );
                }
            
                console.log(
                    '🛰️ [CTW2 SATELLITE] Satellite mode activated.'
                );
            
                createSatelliteLayer();
            
                await loadCTW2Satellite();
            
                // ---------------------------------------------------------
                // Load and display coastline
                // ---------------------------------------------------------
            
                await loadSatelliteCoastlineData();
            
                const coastlineLayer =
                    createSatelliteCoastlineLayer();

                await loadSatelliteCountryData();
                
                const countryBordersLayer =
                    createSatelliteCountryBordersLayer();
                
                if (countryBordersLayer) {
                
                    if (!map.hasLayer(countryBordersLayer)) {
                        map.addLayer(countryBordersLayer);
                    }
                
                    countryBordersLayer.bringToFront();
                }

                if (coastlineLayer) {
            
                    if (!map.hasLayer(coastlineLayer)) {
                        map.addLayer(coastlineLayer);
                    }
            
                    coastlineLayer.bringToFront();
                }
            
                startSatelliteRefresh();
            
                return;
            }
        }
        // НЕУБИВАЕМЫЙ МЕТЕОЗОНД (ИСПРАВЛЕНО: ЯРЛЫК ТЕПЕРЬ СТРЕЛЯЕТ С ПЕРВОГО КЛИКА)

                                    <div style="margin: 2px 0; color:rgba(255,255,255,0.6); font-size:11px;"><b>GPS:</b> ${gpsCoords.lat.toFixed(2)}, ${gpsCoords.lng.toFixed(2)}</div>
                                    <div><b>Температура:</b> <span class="weather-temp-val">${resData.temp}°C</span></div>
                                    <div><b>Ветер:</b> ${resData.windspeed || 4.2} км/ч</div>
                                </div>
                            `)
                            .openOn(map);
                    }
                } catch (err) {
                    Swal.close();
                    console.error("Ошибка точечного сканирования погоды: ", err);
                }
            });
        }

        function updateCTW2CountryPanel() {
        
            const flagElement =
                document.getElementById(
                    'ctw2CountryFlag'
                );
        
            const nameElement =
                document.getElementById(
                    'ctw2CountryName'
                );
        
            const citiesElement =
                document.getElementById(
                    'ctw2CountryCities'
                );
        
            const capitalElement =
                document.getElementById(
                    'ctw2CountryCapital'
                );
        
            const populationElement =
                document.getElementById(
                    'ctw2CountryPopulation'
                );
        
            if (
                !flagElement ||
                !nameElement ||
                !citiesElement ||
                !capitalElement ||
                !populationElement
            ) {
                return;
            }
        
            if (!currentCTW2Country) {
        
                flagElement.textContent = '🏳️';
        
                nameElement.textContent =
                    'YOUR COUNTRY';
        
                citiesElement.textContent =
                    '0';
        
                capitalElement.textContent =
                    'Not selected';
        
                populationElement.textContent =
                    '0';
        
                return;
            }
        
            flagElement.textContent =
                currentCTW2Country.flag || '🏳️';
        
            nameElement.textContent =
                currentCTW2Country.name ||
                'YOUR COUNTRY';
        
            citiesElement.textContent =
                Number(
                    currentCTW2Country.cities || 0
                ).toLocaleString();
        
            capitalElement.textContent =
                currentCTW2Country.capital ||
                'Not selected';
        
            populationElement.textContent =
                Number(
                    currentCTW2Country.population || 0
                ).toLocaleString();
        }

        async function loadCTW2CountryPanel() {
        
            try {
        
                const response =
                    await fetch(
                        '/api/ctw2/countries/list'
                    );
        
                const data =
                    await response.json();
        
                if (
                    data.status !== 'success'
                ) {
                    return;
                }
        
                const countries =
                    Array.isArray(data.countries)
                        ? data.countries
                        : [];
        
                const myCountry =
                    countries.find(
                        country =>
                            country.username ===
                            currentUser
                    );
        
                if (!myCountry) {
        
                    currentCTW2Country = null;
        
                    updateCTW2CountryPanel();
        
                    return;
                }
        
                /*
                 * For now we get the city statistics
                 * from the city API.
                 */
        
                const cityResponse =
                    await fetch(
                        '/api/ctw2/cities'
                    );
        
                const cityData =
                    await cityResponse.json();
        
                const cities =
                    cityData.status === 'success' &&
                    Array.isArray(cityData.cities)
                        ? cityData.cities
                        : [];
        
                const ownedCities =
                    cities.filter(
                        city =>
                            city.owner_username ===
                            currentUser
                    );
        
                const population =
                    ownedCities.reduce(
                        (total, city) =>
                            total +
                            Number(
                                city.population || 100
                            ),
                        0
                    );
        
                const capital =
                    ownedCities.find(
                        city =>
                            city.is_capital === true
                    );
        
                currentCTW2Country = {
        
                    name:
                        myCountry.name ||
                        'YOUR COUNTRY',
        
                    flag:
                        myCountry.flag ||
                        '🏳️',
        
                    cities:
                        ownedCities.length,
        
                    population:
                        population,
        
                    capital:
                        capital
                            ? capital.name
                            : null
                };
        
                updateCTW2CountryPanel();
                
                /*
                 * The city markers may have been rendered
                 * before the country information finished loading.
                 *
                 * Re-render them now so their popups use
                 * the correct country name.
                 */
                renderCTW2Cities();
                
                console.log(
                    '🌍 [CTW2 COUNTRY PANEL]',
                    currentCTW2Country
                );
        
            } catch (error) {
        
                console.error(
                    '🚨 [CTW2 COUNTRY PANEL ERROR]',
                    error
                );
        
            }
        }

        function startSatelliteRefresh() {
        
            stopSatelliteRefresh();
        
            satelliteRefreshTimer =
                setInterval(
                    async () => {
            
                        if (
                            currentMapMode !== 'satellite'
                        ) {
                            return;
                        }
            
                        /*
                         * NOAA
                         */
                        if (satelliteLayer) {
                            satelliteLayer.redraw();
                        }
            
                        /*
                         * Meteosat
                         */
                        await loadMeteosatSatellite();
            
                        /*
                         * Himawari
                         *
                         * This checks JMA's latest timestamp
                         * and replaces the layer if a new
                         * image exists.
                         */
                        await loadHimawariSatellite();
            
                        console.log(
                            '🛰️ [CTW2 SATELLITE] All satellite sources refreshed.'
                        );
            
                    },
                    10 * 60 * 1000
                );
        }

        function stopSatelliteRefresh() {
        
            if (
                satelliteRefreshTimer !== null
            ) {
        
                clearInterval(
                    satelliteRefreshTimer
                );
        
                satelliteRefreshTimer = null;
        
            }
        }

        function removeSatelliteLayer() {
        
            stopSatelliteRefresh();
        
            if (
                satelliteLayer &&
                map.hasLayer(
                    satelliteLayer
                )
            ) {
        
                map.removeLayer(
                    satelliteLayer
                );
        
            }
        
            if (
                himawariLayer &&
                map.hasLayer(
                    himawariLayer
                )
            ) {
        
                map.removeLayer(
                    himawariLayer
                );
        
            }
        
            if (
                meteosatLayer &&
                map.hasLayer(
                    meteosatLayer
                )
            ) {
        
                map.removeLayer(
                    meteosatLayer
                );
        
            }
        
            satelliteLoading = false;
        
        }
        
        function createSatelliteLayer() {
        
            if (satelliteLayer) {
                return satelliteLayer;
            }
        
            satelliteLayer =
                L.tileLayer(
                    SATELLITE_SERVICE_URL +
                    '/tile/{z}/{y}/{x}',
                    {
                        minZoom: 0,
        
                        maxZoom: 23,
        
                        maxNativeZoom: 23,
        
                        tileSize: 256,
        
                        opacity: 1.0,
        
                        zIndex: 500,
        
                        bounds: [
                            [-70, -180],
                            [70, 170]
                        ],
        
                        attribution:
                            'Satellite imagery © NOAA'
                    }
                );
        
            return satelliteLayer;
        }

        async function loadCTW2Satellite() {
        
            if (
                currentMapMode !== 'satellite'
            ) {
                return;
            }
        
            if (!satelliteLayer) {
        
                createSatelliteLayer();
        
            }
        
            satelliteLayer.setZIndex(500);
        
            if (
                !map.hasLayer(
                    satelliteLayer
                )
            ) {
        
                satelliteLayer.addTo(map);
        
            }
        
            satelliteLayer.bringToFront();
        
            satelliteImageTimestamp =
                new Date();
        
            console.log(
                '🛰️ [CTW2 SATELLITE] NOAA tiled imagery active.'
            );
        
            await loadHimawariSatellite();
        
            await loadMeteosatSatellite();
        
        }
        
        function createHimawariLayer() {
        
            if (himawariLayer) {
                map.removeLayer(himawariLayer);
                himawariLayer = null;
            }
        
            /*
             * NASA GIBS Himawari-9/AHI
             * Red Visible 0.64 µm
             *
             * This is normal visible satellite imagery.
             * It is NOT infrared.
             */
        
            const url =
                'https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/' +
                'Himawari_AHI_Band3_Red_Visible_1km/' +
                'default/{time}/' +
                'GoogleMapsCompatible_Level6/' +
                '{z}/{y}/{x}.jpg';
        
            const today = new Date();
            const date =
                today.getUTCFullYear() + '-' +
                String(today.getUTCMonth() + 1).padStart(2, '0') + '-' +
                String(today.getUTCDate()).padStart(2, '0');
        
            const finalUrl = url.replace('{time}', date);
        
            himawariLayer = L.tileLayer(finalUrl, {
                minZoom: 0,
                maxZoom: 6,
                maxNativeZoom: 6,
        
                tileSize: 256,
        
                opacity: 1.0,
        
                noWrap: false,
        
                zIndex: 450,
        
                attribution:
                    'Himawari-9/AHI © JMA / NASA GIBS'
            });
        
            return himawariLayer;
        }

        async function loadHimawariSatellite() {
        
            try {
        
                console.log(
                    '🛰️ [HIMAWARI] Loading NASA GIBS visible imagery...'
                );
        
                const layer = createHimawariLayer();
        
                if (!layer) {
                    console.warn(
                        '⚠️ [HIMAWARI] Layer could not be created.'
                    );
                    return;
                }
        
                layer.addTo(map);
        
                himawariTime = Date.now();
        
                console.log(
                    '🛰️ [HIMAWARI] NASA GIBS visible imagery active.'
                );
        
            } catch (error) {
        
                console.error(
                    '🚨 [HIMAWARI] Visible imagery failed:',
                    error
                );
            }
        }

        async function getLatestMeteosatTime() {
        
            try {
        
                const response =
                    await fetch(
                        'https://view.eumetsat.int/geoserver/wms' +
                        '?service=WMS' +
                        '&request=GetCapabilities',
                        {
                            cache: 'no-store'
                        }
                    );
        
                if (!response.ok) {
                    throw new Error(
                        'Meteosat GetCapabilities failed: ' +
                        response.status
                    );
                }
        
                const text =
                    await response.text();
        
                /*
                 * We don't need to parse the whole
                 * capabilities document here yet.
                 *
                 * The important part is that the WMS
                 * service is time-enabled. We will use
                 * the latest available frame from the
                 * server on the next step.
                 */
        
                console.log(
                    '🛰️ [CTW2 METEOSAT] WMS capabilities loaded.'
                );
        
                return null;
        
            }
            catch (error) {
        
                console.error(
                    '🚨 [CTW2 METEOSAT TIME] Failed:',
                    error
                );
        
                return null;
            }
        }

        function createMeteosatLayer() {
        
            if (meteosatLayer) {
                return meteosatLayer;
            }
        
            meteosatLayer =
                L.tileLayer.wms(
                    METEOSAT_WMS_URL,
                    {
                        layers:
                            'mtg_fd:rgb_geocolour',
        
                        version:
                            '1.3.0',
        
                        format:
                            'image/png',
        
                        transparent:
                            true,
        
                        styles:
                            '',
        
                        opacity:
                            1.0,
        
                        zIndex:
                            475,
        
                        bounds: [
                            [-77, -95],
                            [77, 95]
                        ],
        
                        attribution:
                            'Meteosat imagery © EUMETSAT / NASA',
        
                        _ctw2_frame:
                            meteosatRefreshKey
                    }
                );
        
            return meteosatLayer;
        }

        async function loadMeteosatSatellite() {
        
            if (
                currentMapMode !== 'satellite'
            ) {
                return;
            }
        
            /*
             * Every refresh gets one single frame key.
             * All WMS tiles requested during this
             * refresh therefore belong to the same
             * client-side generation.
             */
            meteosatRefreshKey =
                Date.now();
        
            if (!meteosatLayer) {
        
                createMeteosatLayer();
        
            } else {
        
                meteosatLayer.setParams({
                    _ctw2_frame:
                        meteosatRefreshKey
                });
        
            }
        
            if (
                !map.hasLayer(
                    meteosatLayer
                )
            ) {
        
                meteosatLayer.addTo(map);
        
            }
        
            meteosatLayer.setZIndex(475);
        
            meteosatLayer.redraw();
        
            console.log(
                '🛰️ [CTW2 METEOSAT] Frame refresh:',
                meteosatRefreshKey
            );
        }

        let satelliteCoastlineData = null;
        
        async function loadSatelliteCoastlineData() {
        
            if (satelliteCoastlineData) {
                return satelliteCoastlineData;
            }
        
            try {
        
                const base =
                    'https://raw.githubusercontent.com/kristimsu-beep/pinnogram/main/data/ne_50m_land%5B1%5D';
        
                const response =
                    await fetch(
                        base + '.shp'
                    );
        
                if (!response.ok) {
                    throw new Error(
                        `SHP file HTTP ${response.status}`
                    );
                }
        
                const shpBuffer =
                    await response.arrayBuffer();
        
                const geometries =
                    shp.parseShp(
                        shpBuffer
                    );
        
                satelliteCoastlineData =
                    geometries;
        
                console.log(
                    '🌊 [CTW2 SATELLITE] Coastline data loaded.',
                    satelliteCoastlineData
                );
        
                return satelliteCoastlineData;
        
            } catch (error) {
        
                console.error(
                    '🚨 [CTW2 SATELLITE] Coastline failed to load:',
                    error
                );
        
                return null;
            }
        }

        let satelliteCountryData = null;
        
        async function loadSatelliteCountryData() {
        
            if (satelliteCountryData) {
                return satelliteCountryData;
            }
        
            try {
        
                const base =
                    'https://raw.githubusercontent.com/kristimsu-beep/pinnogram/main/data/ne_10m_admin_0_countries%5B1%5D';
        
                const response =
                    await fetch(
                        base + '.shp'
                    );
        
                if (!response.ok) {
                    throw new Error(
                        `Country SHP HTTP ${response.status}`
                    );
                }
        
                const shpBuffer =
                    await response.arrayBuffer();
        
                const geometries =
                    shp.parseShp(
                        shpBuffer
                    );
        
                satelliteCountryData =
                    geometries;
        
                console.log(
                    '🌍 [CTW2 SATELLITE] Country border data loaded.',
                    satelliteCountryData
                );
        
                return satelliteCountryData;
        
            } catch (error) {
        
                console.error(
                    '🚨 [CTW2 SATELLITE] Country borders failed to load:',
                    error
                );
        
                return null;
            }
        }

        function createSatelliteCoastlineLayer() {
        
            if (!satelliteCoastlineData) {
                console.warn(
                    '⚠️ [CTW2 SATELLITE] No coastline data available.'
                );
                return null;
            }
        
            if (satelliteCoastlineLayer) {
                return satelliteCoastlineLayer;
            }
        
            satelliteCoastlineLayer =
                L.geoJSON(
                    satelliteCoastlineData,
                    {
                        style: {
                            color: '#ffffff',
                            weight: 1.2,
                            opacity: 0.95,
                            fill: false
                        },
        
                        interactive: false
                    }
                );
        
            satelliteCoastlineLayer.setZIndex(600);
        
            console.log(
                '🌊 [CTW2 SATELLITE] Coastline layer created.'
            );
        
            return satelliteCoastlineLayer;
        }

        function createSatelliteCountryBordersLayer() {
        
            if (!satelliteCountryData) {
                console.warn(
                    '⚠️ [CTW2 SATELLITE] No country border data available.'
                );
                return null;
            }
        
            if (satelliteCountryBordersLayer) {
                return satelliteCountryBordersLayer;
            }
        
            satelliteCountryBordersLayer =
                L.geoJSON(
                    satelliteCountryData,
                    {
                        style: {
                            color: '#ffffff',
                            weight: 0.7,
                            opacity: 0.65,
                            fill: false
                        },
        
                        interactive: false
                    }
                );
        
            satelliteCountryBordersLayer.setZIndex(610);
        
            console.log(
                '🌍 [CTW2 SATELLITE] Country borders layer created.'
            );
        
            return satelliteCountryBordersLayer;
        }
    </script>
