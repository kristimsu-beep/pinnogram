<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CTW2 Real Temperature Map</title>

    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>

    <link
        rel="stylesheet"
        href="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.css"
    >

    <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@panoramax/web-viewer@5.2.0/build/esm/index_photoviewer.js"
    ></script>

    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #111;
        }


        #map {

            width: 100%;
            height: 100%;
        }


        /* =================================================
           TITLE
        ================================================= */

        .map-title {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            padding: 10px 14px;

            border-radius: 10px;

            background: rgba(20, 20, 20, 0.88);

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.35);
        }


        /* =================================================
           TEMPERATURE LEGEND
        ================================================= */

        .temperature-legend {

            position: absolute;

            right: 20px;
            bottom: 25px;

            z-index: 1000;

            width: 180px;

            padding: 12px;

            border-radius: 10px;

            background:
                rgba(20, 20, 20, 0.90);

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.35);
        }


        .temperature-legend-title {

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 700;
        }


        .temperature-gradient {

            width: 100%;
            height: 14px;

            border-radius: 5px;

            background:
                linear-gradient(
                    to right,

                    #821692,
                    #0000ff,
                    #00ffff,
                    #00ff00,
                    #ffff00,
                    #ff8000,
                    #ff0000
                );
        }


        .temperature-labels {

            display: flex;

            justify-content:
                space-between;

            margin-top: 5px;

            font-size: 10px;

            color: #ddd;
        }

        /* =========================================================
           CURSOR TEMPERATURE
           ========================================================= */
        
        #temperatureProbe {
            position: absolute;
        
            z-index: 1000;
        
            display: none;
        
            padding: 7px 10px;
        
            border-radius: 8px;
        
            background: rgba(15, 15, 20, 0.90);
        
            color: white;
        
            font-size: 14px;
        
            font-weight: 700;
        
            white-space: nowrap;
        
            pointer-events: none;
        
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        
            backdrop-filter: blur(6px);
        
            transform: translate(14px, -50%);
        }

        /* =========================================================
           CTW2 PANORAMA EXPLORER
           ========================================================= */
        
        #panoramaExplorer {
            position: fixed;
        
            inset: 0;
        
            z-index: 5000;
        
            display: none;
        
            flex-direction: column;
        
            background: #050609;
        
            color: white;
        }
        
        
        /* =========================================================
           HEADER
           ========================================================= */
        
        #panoramaExplorerHeader {
            height: 58px;
        
            flex: 0 0 58px;
        
            display: flex;
        
            align-items: center;
        
            justify-content: space-between;
        
            padding: 0 18px;
        
            background:
                rgba(10, 12, 18, 0.96);
        
            border-bottom:
                1px solid rgba(255, 255, 255, 0.12);
        }
        
        
        /* =========================================================
           LOCATION TEXT
           ========================================================= */
        
        #panoramaExplorerLocation {
            display: block;
        
            margin-top: 2px;
        
            font-size: 12px;
        
            opacity: 0.65;
        }
        
        
        /* =========================================================
           CLOSE BUTTON
           ========================================================= */
        
        #panoramaExplorerClose {
            width: 40px;
        
            height: 40px;
        
            border: none;
        
            border-radius: 10px;
        
            background:
                rgba(255, 255, 255, 0.10);
        
            color: white;
        
            font-size: 20px;
        
            cursor: pointer;
        
            transition:
                background 0.15s ease,
                transform 0.15s ease;
        }
        
        #panoramaExplorerClose:hover {
            background:
                rgba(255, 255, 255, 0.20);
        
            transform: scale(1.05);
        }
        
        
        /* =========================================================
           CONTENT
           ========================================================= */
        
        #panoramaExplorerContent {
            position: relative;
        
            flex: 1;
        
            min-height: 0;
        
            display: flex;
        
            flex-direction: column;
        }
        
        
        /* =========================================================
           VIEWER PANES
           ========================================================= */
        
        .explorerPane {
            position: relative;
        
            min-height: 0;
        
            overflow: hidden;
        
            background: #08090c;
        }
        
        
        /* Panorama = larger area */
        
        #streetViewContainer {
            position: relative;
            flex: 3;
        }
        
        
        /* Terrain = smaller area */
        
        #terrainContainer {
            flex: 1;
        
            border-top:
                1px solid rgba(255, 255, 255, 0.15);
        }
        
        
        /* =========================================================
           LOADING
           ========================================================= */
        
        .explorerLoading {
            position: absolute;
        
            inset: 0;
        
            display: flex;
        
            align-items: center;
        
            justify-content: center;
        
            font-size: 15px;
        
            color: rgba(255, 255, 255, 0.75);
        
            pointer-events: none;
        }
        
        
        /* =========================================================
           MAPLIBRE
           ========================================================= */
        
        #terrainContainer .maplibregl-map {
            width: 100%;
        
            height: 100%;
        }
        
        
        /* =========================================================
           MOBILE
           ========================================================= */
        
        @media (max-width: 800px) {
        
            #panoramaExplorerContent {
                flex-direction: column;
            }
        
            #streetViewContainer {
                flex: 2;
            }
        
            #terrainContainer {
                flex: 1;
            }
        }

        /* =========================================================
           PANORAMAX VIEWER
           ========================================================= */
        
        #panoramaxViewerContainer {
            position: absolute;
            inset: 0;
        
            width: 100%;
            height: 100%;
        
            overflow: hidden;
        
            background: #000;
        
            z-index: 10;
        }
        
        #panoramaxViewerContainer pnx-photo-viewer {
            display: block;
        
            width: 100%;
            height: 100%;
        
            min-height: 300px;
        }

    </style>

</head>


<body>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div class="map-title">


        🌡️ CTW2 Real Temperature Map

    </div>

    <div id="temperatureProbe">
        🌡️ <span id="temperatureProbeValue">--.-°C</span>
    </div>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>

    <!-- =========================================================
         CTW2 PANORAMA EXPLORER
    ========================================================= -->
    
    <div id="panoramaExplorer">
    
        <div id="panoramaExplorerHeader">
            <div>
                <strong>🌍 CTW2 Local Explorer</strong>
                <span id="panoramaExplorerLocation">
                    Loading location...
                </span>
            </div>
    
            <button
                id="panoramaExplorerClose"
                type="button"
            >
                ✕
            </button>
        </div>
    
    
        <div id="panoramaExplorerContent">

            <div
                id="streetViewContainer"
                class="explorerPane"
            >
                <div
                    id="panoramaxViewerContainer"
                >
                    <div class="explorerLoading">
                        🔎 Ищем ближайшую панораму...
                    </div>
                </div>
            </div>
    
            <div
                id="terrainContainer"
                class="explorerPane"
            >
                <div class="explorerLoading">
                    ⛰️ Загружаем 3D-рельеф...
                </div>
            </div>
    
        </div>
    
    </div>

    <!-- =====================================================
         LEGEND
    ====================================================== -->

    <div class="temperature-legend">

        <div class="temperature-legend-title">

            Air temperature

        </div>


        <div class="temperature-gradient"></div>


        <div class="temperature-labels">

            <span>-50°C</span>

            <span>0°C</span>

            <span>+50°C</span>

        </div>

    </div>


    <!-- =====================================================
         MAP SCRIPT
    ====================================================== -->

    <script>

        /*
         * ====================================================
         * CREATE MAP
         * ====================================================
         */

        const map = L.map(
            "map",
            {
                center: [20, 0],

                zoom: 2,

                minZoom: 2,

                maxZoom: 8,

                worldCopyJump: true
            }
        );


        /*
         * ====================================================
         * BASE MAP
         * ====================================================
         *
         * We use OpenStreetMap as the geographical base.
         *
         * The temperature layer is placed above it.
         */

        const baseLayer = L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }

        );


        baseLayer.addTo(map);


        /*
         * ====================================================
         * REAL TEMPERATURE
         * ====================================================
         *
         * This goes through our FastAPI proxy:
         *
         * /map/{z}/{x}/{y}.png
         *
         * FastAPI then requests:
         *
         * OpenWeather temp_new
         */

        const temperatureLayer = L.tileLayer(

            "/map/{z}/{x}/{y}.png",

            {
                opacity: 0.95,

                tileSize: 256,

                updateWhenIdle: true,

                updateWhenZooming: false,

                attribution:
                    "Weather data © OpenWeather"
            }

        );

        // =========================================================
        // NIGHT ZONE
        // =========================================================
        
        const nightLayer = L.terminator({
            resolution: 2,
            fillColor: "#000000",
            fillOpacity: 0.18,
            color: "#111111",
            weight: 0,
            opacity: 0
        });

        temperatureLayer.addTo(map);


        /*
         * ====================================================
         * DEBUG
         * ====================================================
         */

        console.log(
            "🌡️ [CTW2 MAP] Temperature layer loaded."
        );


        console.log(
            "🗺️ [CTW2 MAP] Real temperature source:",
            "/map/{z}/{x}/{y}.png"
        );

        // =========================================================
        // MAP LAYER SWITCHER
        // =========================================================
        
        L.control.layers(
            null,
            {
                "🌡️ Temperature": temperatureLayer,
                "🌙 Night Zone": nightLayer
            },
            {
                collapsed: false
            }
        ).addTo(map);

        // =========================================================
        // UPDATE NIGHT ZONE
        // =========================================================
        
        function updateNightZone() {
            nightLayer.setTime(new Date());
        }
        
        updateNightZone();
        
        setInterval(
            updateNightZone,
            60 * 1000
        );

        // =========================================================
        // CURSOR TEMPERATURE
        // =========================================================
        
        const temperatureProbe =
            document.getElementById(
                "temperatureProbe"
            );
        
        const temperatureProbeValue =
            document.getElementById(
                "temperatureProbeValue"
            );
        
        let temperatureProbeTimer = null;
        
        let temperatureProbeRequestId = 0;
        
        
        // =========================================================
        // HIDE PROBE
        // =========================================================
        
        function hideTemperatureProbe() {
        
            temperatureProbe.style.display =
                "none";
        }
        
        
        // =========================================================
        // SHOW PROBE
        // =========================================================
        
        function showTemperatureProbe(
            containerPoint,
            text
        ) {
        
            temperatureProbe.style.left =
                `${containerPoint.x}px`;
        
            temperatureProbe.style.top =
                `${containerPoint.y}px`;
        
            temperatureProbeValue.textContent =
                text;
        
            temperatureProbe.style.display =
                "block";
        }
        
        
        // =========================================================
        // REQUEST TEMPERATURE
        // =========================================================
        
        async function requestCursorTemperature(
            lat,
            lon,
            containerPoint
        ) {
        
            const requestId =
                ++temperatureProbeRequestId;
        
            showTemperatureProbe(
                containerPoint,
                "..."
            );
        
            try {
        
                const response = await fetch(
                    `/map/temperature?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`
                );
        
                const data =
                    await response.json();
        
                // Ignore old requests
                if (
                    requestId !==
                    temperatureProbeRequestId
                ) {
                    return;
                }
        
                if (
                    data.error ||
                    typeof data.temperature !== "number"
                ) {
                    hideTemperatureProbe();
                    return;
                }
        
                showTemperatureProbe(
                    containerPoint,
                    `${data.temperature.toFixed(1)}°C`
                );
        
            } catch (error) {
        
                console.error(
                    "🌡️ [CTW2 MAP] Temperature probe error:",
                    error
                );
        
                hideTemperatureProbe();
            }
        }
        
        
        // =========================================================
        // MAP MOUSE MOVE
        // =========================================================
        
        map.on(
            "mousemove",
            function (event) {
        
                // Temperature layer disabled
                if (
                    !map.hasLayer(
                        temperatureLayer
                    )
                ) {
                    hideTemperatureProbe();
                    return;
                }
        
                // Move the existing label immediately
                if (
                    temperatureProbe.style.display ===
                    "block"
                ) {
                    temperatureProbe.style.left =
                        `${event.containerPoint.x}px`;
        
                    temperatureProbe.style.top =
                        `${event.containerPoint.y}px`;
                }
        
                // Cancel previous delayed request
                if (temperatureProbeTimer) {
                    clearTimeout(
                        temperatureProbeTimer
                    );
                }
        
                // Wait a little while before requesting
                // a new temperature.
                temperatureProbeTimer =
                    setTimeout(
                        function () {
        
                            requestCursorTemperature(
                                event.latlng.lat,
                                event.latlng.lng,
                                event.containerPoint
                            );
        
                        },
                        450
                    );
            }
        );
        
        
        // =========================================================
        // MOUSE LEAVE
        // =========================================================
        
        map.on(
            "mouseout",
            function () {
                hideTemperatureProbe();
        
                if (temperatureProbeTimer) {
        
                    clearTimeout(
                        temperatureProbeTimer
                    );
        
                    temperatureProbeTimer =
                        null;
                }
            }
        );
        
        
        // =========================================================
        // LAYER VISIBILITY
        // =========================================================
        
        map.on(
            "overlayadd",
            function (event) {
        
                if (
                    event.layer ===
                    temperatureLayer
                ) {
                    console.log(
                        "🌡️ [CTW2 MAP] Temperature probe enabled."
                    );
                }
            }
        );
        
        
        map.on(
            "overlayremove",
            function (event) {
        
                if (
                    event.layer ===
                    temperatureLayer
                ) {
                    hideTemperatureProbe();
        
                    console.log(
                        "🌡️ [CTW2 MAP] Temperature probe disabled."
                    );
                }
            }
        );

        // =========================================================
        // CTW2 LOCAL EXPLORER
        // =========================================================
        
        const panoramaExplorer =
            document.getElementById(
                "panoramaExplorer"
            );
        
        const panoramaExplorerClose =
            document.getElementById(
                "panoramaExplorerClose"
            );
        
        const panoramaExplorerLocation =
            document.getElementById(
                "panoramaExplorerLocation"
            );
        
        const streetViewContainer =
            document.getElementById(
                "streetViewContainer"
            );
        
        const terrainContainer =
            document.getElementById(
                "terrainContainer"
            );
        
        
        let explorerPressTimer = null;
        
        let explorerPressStart = null;
        
        let explorerPressLatLng = null;
        
        let explorerLongPressTriggered = false;
        
        let explorerPanorama = null;
        
        let explorerTerrainMap = null;
        
        let explorerTerrainMarker = null;
        

        
        
        // =========================================================
        // CLEAR PANORAMA CONTAINER
        // =========================================================
        
        function clearStreetView() {
            streetViewContainer.innerHTML = "";
        }

        // =========================================================
        // CLEAR TERRAIN CONTAINER
        // =========================================================
        
        function clearTerrain() {
        
            terrainContainer.innerHTML = "";
        
        }
        
        
        // =========================================================
        // SHOW EXPLORER
        // =========================================================
        
        function showExplorer(latitude, longitude) {
        
            panoramaExplorer.style.display =
                "flex";
        
            document.body.style.overflow =
                "hidden";
        
            if (
                typeof latitude === "number" &&
                typeof longitude === "number"
            ) {
                loadPanoramaxForLocation(
                    latitude,
                    longitude
                );
            }
        }
                
        
        // =========================================================
        // CLOSE EXPLORER
        // =========================================================
        
        function closeExplorer() {
        
            panoramaExplorer.style.display =
                "none";
        
            document.body.style.overflow =
                "";

            explorerPanorama = null;
        
            explorerTerrainMap = null;
        
            explorerTerrainMarker = null;
        
            clearStreetView();
        
            clearTerrain();

            clearPanoramaxViewer();
        }
        
        /* =========================================================
           PANORAMAX
           ========================================================= */
        
        const PANORAMAX_ENDPOINT =
            "https://api.panoramax.xyz/api";
        
        let panoramaxViewer = null;
        
        
        /**
         * Wait until the Panoramax Web Component
         * has been registered by the ESM module.
         */
        async function waitForPanoramax() {
        
            if (
                customElements.get("pnx-photo-viewer")
            ) {
                return true;
            }
        
            await customElements.whenDefined(
                "pnx-photo-viewer"
            );
        
            return true;
        }
        
        
        /**
         * Find the closest Panoramax picture
         * to the supplied coordinates.
         */
        async function findNearestPanoramaxPicture(
            latitude,
            longitude
        ) {
        
            console.log(
                "[PANORAMAX] Searching near:",
                latitude,
                longitude
            );
        
            await waitForPanoramax();
        
            try {
        
                /*
                 * Panoramax's own API helper.
                 */
                if (
                    window.Panoramax &&
                    window.Panoramax.utils &&
                    window.Panoramax.utils.API
                ) {
        
                    const api =
                        new window.Panoramax.utils.API(
                            PANORAMAX_ENDPOINT
                        );
        
                    await api.onceReady();
        
                    const result =
                        await api.getPicturesAroundCoordinates(
                            latitude,
                            longitude,
                            0.01,
                            20
                        );
        
                    console.log(
                        "[PANORAMAX] Search result:",
                        result
                    );
        
                    if (
                        !result ||
                        !result.features ||
                        !result.features.length
                    ) {
        
                        return null;
                    }
        
                    /*
                     * Find the geographically closest picture.
                     */
                    let closest = null;
                    let closestDistance = Infinity;
        
                    for (
                        const feature of result.features
                    ) {
        
                        if (
                            !feature.geometry ||
                            !feature.geometry.coordinates
                        ) {
                            continue;
                        }
        
                        const [
                            pictureLongitude,
                            pictureLatitude
                        ] = feature.geometry.coordinates;
        
                        const distance =
                            Math.pow(
                                pictureLatitude - latitude,
                                2
                            ) +
                            Math.pow(
                                pictureLongitude - longitude,
                                2
                            );
        
                        if (
                            distance <
                            closestDistance
                        ) {
        
                            closestDistance = distance;
                            closest = feature;
                        }
                    }
        
                    if (!closest) {
                        return null;
                    }
        
                    return closest;
                }
        
                /*
                 * Fallback:
                 * directly query the Panoramax STAC API.
                 */
                const delta = 0.01;
        
                const bbox = [
                    longitude - delta,
                    latitude - delta,
                    longitude + delta,
                    latitude + delta
                ].join(",");
        
                const url =
                    `${PANORAMAX_ENDPOINT}/search` +
                    `?bbox=${encodeURIComponent(bbox)}` +
                    `&limit=20`;
        
                console.log(
                    "[PANORAMAX] Fallback search:",
                    url
                );
        
                const response =
                    await fetch(url);
        
                if (!response.ok) {
        
                    throw new Error(
                        `Panoramax API returned ${response.status}`
                    );
                }
        
                const data =
                    await response.json();
        
                if (
                    !data ||
                    !data.features ||
                    !data.features.length
                ) {
        
                    return null;
                }
        
                let closest = null;
                let closestDistance = Infinity;
        
                for (
                    const feature of data.features
                ) {
        
                    if (
                        !feature.geometry ||
                        !feature.geometry.coordinates
                    ) {
                        continue;
                    }
        
                    const [
                        pictureLongitude,
                        pictureLatitude
                    ] = feature.geometry.coordinates;
        
                    const distance =
                        Math.pow(
                            pictureLatitude - latitude,
                            2
                        ) +
                        Math.pow(
                            pictureLongitude - longitude,
                            2
                        );
        
                    if (
                        distance <
                        closestDistance
                    ) {
        
                        closestDistance = distance;
                        closest = feature;
                    }
                }
        
                return closest;
        
            } catch (error) {
        
                console.error(
                    "[PANORAMAX] Search failed:",
                    error
                );
        
                return null;
            }
        }
        
        
        /**
         * Extract Panoramax IDs from a STAC feature.
         */
        function extractPanoramaxIds(feature) {
        
            if (!feature) {
                return null;
            }
        
            const pictureId =
                feature.id ||
                feature.properties?.id ||
                null;
        
            let sequenceId =
                feature.collection ||
                feature.properties?.collection ||
                null;
        
            /*
             * Some Panoramax responses provide
             * the sequence through links.
             */
            if (
                !sequenceId &&
                Array.isArray(feature.links)
            ) {
        
                const collectionLink =
                    feature.links.find(
                        link =>
                            link.rel === "collection"
                    );
        
                if (collectionLink) {
        
                    const href =
                        collectionLink.href || "";
        
                    const parts =
                        href.split("/");
        
                    sequenceId =
                        parts[parts.length - 1] ||
                        null;
                }
            }
        
            if (
                !pictureId ||
                !sequenceId
            ) {
        
                console.warn(
                    "[PANORAMAX] Could not extract IDs:",
                    feature
                );
        
                return null;
            }
        
            return {
                pictureId,
                sequenceId
            };
        }
        
        
        /**
         * Load a Panoramax picture into the explorer.
         */
        async function loadPanoramaxForLocation(
            latitude,
            longitude
        ) {
        
            console.log(
                "[PANORAMAX] Loading location:",
                latitude,
                longitude
            );
        
            const container =
                document.getElementById(
                    "panoramaxViewerContainer"
                );
        
            if (!container) {
        
                console.error(
                    "[PANORAMAX] Viewer container not found."
                );
        
                return;
            }
        
            container.innerHTML = `
                <div
                    style="
                        width:100%;
                        height:100%;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:white;
                        background:#000;
                        font-family:system-ui,sans-serif;
                    "
                >
                    Searching for nearby panorama...
                </div>
            `;
        
            const feature =
                await findNearestPanoramaxPicture(
                    latitude,
                    longitude
                );
        
            if (!feature) {
        
                container.innerHTML = `
                    <div
                        style="
                            width:100%;
                            height:100%;
                            display:flex;
                            flex-direction:column;
                            align-items:center;
                            justify-content:center;
                            color:white;
                            background:#000;
                            font-family:system-ui,sans-serif;
                            text-align:center;
                            padding:30px;
                            box-sizing:border-box;
                        "
                    >
                        <div style="font-size:42px;">
                            🌐
                        </div>
        
                        <div
                            style="
                                margin-top:12px;
                                font-size:18px;
                                font-weight:600;
                            "
                        >
                            No Panoramax imagery nearby
                        </div>
        
                        <div
                            style="
                                margin-top:8px;
                                opacity:.65;
                                font-size:13px;
                            "
                        >
                            Try selecting another location.
                        </div>
                    </div>
                `;
        
                console.log(
                    "[PANORAMAX] No nearby picture."
                );
        
                return;
            }
        
            console.log(
                "[PANORAMAX] Closest feature:",
                feature
            );
        
            const ids =
                extractPanoramaxIds(feature);
        
            if (!ids) {
        
                container.innerHTML = `
                    <div
                        style="
                            width:100%;
                            height:100%;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            color:white;
                            background:#000;
                            font-family:system-ui,sans-serif;
                        "
                    >
                        Panoramax image data is unavailable.
                    </div>
                `;
        
                return;
            }
        
            console.log(
                "[PANORAMAX] Sequence:",
                ids.sequenceId
            );
        
            console.log(
                "[PANORAMAX] Picture:",
                ids.pictureId
            );
        
            /*
             * Create the actual Panoramax Web Component.
             */
            const viewer =
                document.createElement(
                    "pnx-photo-viewer"
                );
        
            viewer.setAttribute(
                "endpoint",
                PANORAMAX_ENDPOINT
            );
        
            viewer.setAttribute(
                "sequence",
                ids.sequenceId
            );
        
            viewer.setAttribute(
                "picture",
                ids.pictureId
            );
        
            viewer.setAttribute(
                "widgets",
                "true"
            );
        
            viewer.setAttribute(
                "url-parameters",
                "false"
            );
        
            viewer.setAttribute(
                "lang",
                "en"
            );
        
            viewer.style.width = "100%";
            viewer.style.height = "100%";
            viewer.style.display = "block";
        
            container.innerHTML = "";
        
            container.appendChild(viewer);
        
            panoramaxViewer = viewer;
        
            /*
             * Wait for the component to finish loading.
             */
            try {
        
                if (
                    typeof viewer.onceReady ===
                    "function"
                ) {
        
                    await viewer.onceReady();
        
                    console.log(
                        "[PANORAMAX] Viewer ready."
                    );
                }
        
            } catch (error) {
        
                console.error(
                    "[PANORAMAX] Viewer failed:",
                    error
                );
            }
        }
        
        
        /**
         * Remove the current Panoramax viewer.
         */
        function clearPanoramaxViewer() {
        
            const container =
                document.getElementById(
                    "panoramaxViewerContainer"
                );
        
            if (container) {
                container.innerHTML = "";
            }
        
            panoramaxViewer = null;
        
            console.log(
                "[PANORAMAX] Viewer cleared."
            );
        }

        panoramaExplorerClose.addEventListener(
            "click",
            closeExplorer
        );
        
        
        // =========================================================
        // LOAD 3D TERRAIN
        // =========================================================
        
        function loadTerrain(
            lat,
            lon,
            maptilerKey
        ) {
        
            clearTerrain();
        
            explorerTerrainMap =
                new maplibregl.Map({
        
                    container:
                        terrainContainer,
        
                    style:
                        "https://api.maptiler.com/maps/"
                        + "streets-v4/style.json"
                        + `?key=${encodeURIComponent(maptilerKey)}`,
        
                    center: [
                        lon,
                        lat
                    ],
        
                    zoom: 13,
        
                    pitch: 62,
        
                    bearing: 0,
        
                    antialias: true
                });
        
        
            explorerTerrainMap.on(
                "load",
                function() {
        
                    explorerTerrainMap.addSource(
                        "ctw2-terrain",
                        {
                            type: "raster-dem",
        
                            url:
                                "https://api.maptiler.com/"
                                + "tiles/terrain-rgb-v2/"
                                + "tiles.json"
                                + `?key=${encodeURIComponent(maptilerKey)}`,
        
                            tileSize: 512,
        
                            maxzoom: 14
                        }
                    );
        
        
                    explorerTerrainMap.setTerrain({
                        source:
                            "ctw2-terrain",
        
                        exaggeration: 1.35
                    });
        
        
                    explorerTerrainMarker =
                        new maplibregl.Marker({
                            color: "#ff3333"
                        })
                        .setLngLat([
                            lon,
                            lat
                        ])
                        .addTo(
                            explorerTerrainMap
                        );
        
        
                    explorerTerrainMap.addControl(
                        new maplibregl.NavigationControl(),
                        "top-right"
                    );
        
        
                    setTimeout(
                        function() {
        
                            explorerTerrainMap.resize();
        
                        },
                        100
                    );
                }
            );
        }
       
        // =========================================================
        // OPEN EXPLORER AT POINT
        // =========================================================
        
        async function openExplorerAt(
            lat,
            lon
        ) {
        
            showExplorer();
        
            panoramaExplorerLocation.textContent =
                `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
        
        
            streetViewContainer.innerHTML = `
                <div class="explorerLoading">
                    🔎 Ищем ближайшую панораму...
                </div>
            `;
        
            terrainContainer.innerHTML = `
                <div class="explorerLoading">
                    ⛰️ Загружаем 3D-рельеф...
                </div>
            `;
        
        
            try {
        
                // -------------------------------------------------
                // Load configuration
                // -------------------------------------------------
        
                const configResponse =
                    await fetch(
                        "/map/config"
                    );
        
                const config =
                    await configResponse.json();
        
        
                if (
                    !config.maptiler_api_key
                ) {
        
                    throw new Error(
                        "MAPTILER_API_KEY is not configured."
                    );
                }
        
        
                // -------------------------------------------------
                // Search Panoramax + load terrain
                // -------------------------------------------------
        
                const panoramaResponse =
                    await fetch(
                        `/map/panorama?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`
                    );
        
        
                const panoramaData =
                    await panoramaResponse.json();
        
        
                // Terrain starts immediately.
                loadTerrain(
                    lat,
                    lon,
                    config.maptiler_api_key
                );
        
        
                // -------------------------------------------------
                // Panorama result
                // -------------------------------------------------
        
                if (
                    panoramaData.status !==
                    "ok"
                ) {
        
                    streetViewContainer.innerHTML = `
                        <div class="explorerLoading">
                            📍 Панорама рядом не найдена
                        </div>
                    `;
        
                    panoramaExplorerLocation.textContent =
                        `${lat.toFixed(5)}, ${lon.toFixed(5)} · Панорама не найдена`;
        
                    return;
                }
        
        
                const pictureId =
                    panoramaData.picture_id;
        
                const sequenceId =
                    panoramaData.sequence_id;
        
        
                // -------------------------------------------------
                // Show distance
                // -------------------------------------------------
        
                const distance =
                    Math.round(
                        panoramaData.distance_m
                    );
        
        
                panoramaExplorerLocation.textContent =
                    `${lat.toFixed(5)}, ${lon.toFixed(5)} · `
                    + `панорама ${distance} м`;
        
        
                // -------------------------------------------------
                // Create Panoramax viewer
                // -------------------------------------------------
        
                loadPanoramaxViewer(
                    pictureId,
                    sequenceId
                );
        
        
            } catch (error) {
        
                console.error(
                    "🌍 [CTW2 EXPLORER] Failed:",
                    error
                );
        
        
                streetViewContainer.innerHTML = `
                    <div class="explorerLoading">
                        ❌ Не удалось загрузить панораму
                    </div>
                `;
        
        
                terrainContainer.innerHTML = `
                    <div class="explorerLoading">
                        ❌ Не удалось загрузить 3D-рельеф
                    </div>
                `;
            }
        }
        
        
        // =========================================================
        // LONG PRESS HANDLING
        // =========================================================
        
        const mapElement =
            map.getContainer();
        
        
        mapElement.addEventListener(
            "pointerdown",
            function(event) {
        
                // Only primary mouse button,
                // touch and pen.
                if (
                    event.pointerType === "mouse" &&
                    event.button !== 0
                ) {
                    return;
                }
        
        
                explorerLongPressTriggered =
                    false;
        
        
                const rect =
                    mapElement.getBoundingClientRect();
        
        
                const x =
                    event.clientX -
                    rect.left;
        
        
                const y =
                    event.clientY -
                    rect.top;
        
        
                explorerPressStart = {
                    x: x,
                    y: y
                };
        
        
                explorerPressLatLng =
                    map.containerPointToLatLng(
                        [x, y]
                    );
        
        
                clearTimeout(
                    explorerPressTimer
                );
        
        
                explorerPressTimer =
                    setTimeout(
                        function() {
        
                            explorerLongPressTriggered =
                                true;
        
                            const point =
                                explorerPressLatLng;
        
        
                            console.log(
                                "🌍 [CTW2 EXPLORER] Long press:",
                                point.lat,
                                point.lng
                            );
        
        
                            openExplorerAt(
                                point.lat,
                                point.lng
                            );
        
                        },
                        3000
                    );
            }
        );
        
        
        mapElement.addEventListener(
            "pointermove",
            function(event) {
        
                if (
                    !explorerPressStart
                ) {
                    return;
                }
        
        
                const rect =
                    mapElement.getBoundingClientRect();
        
        
                const x =
                    event.clientX -
                    rect.left;
        
        
                const y =
                    event.clientY -
                    rect.top;
        
        
                const dx =
                    x -
                    explorerPressStart.x;
        
        
                const dy =
                    y -
                    explorerPressStart.y;
        
        
                const distance =
                    Math.sqrt(
                        dx * dx +
                        dy * dy
                    );
        
        
                // Moving the map cancels
                // the long press.
                if (
                    distance > 10
                ) {
        
                    clearTimeout(
                        explorerPressTimer
                    );
        
                    explorerPressTimer =
                        null;
        
                    explorerPressStart =
                        null;
        
                    explorerPressLatLng =
                        null;
                }
            }
        );
        
        
        function cancelExplorerPress() {
        
            clearTimeout(
                explorerPressTimer
            );
        
            explorerPressTimer =
                null;
        
            explorerPressStart =
                null;
        
            explorerPressLatLng =
                null;
        }
        
        
        mapElement.addEventListener(
            "pointerup",
            function() {
        
                cancelExplorerPress();
        
            }
        );
        
        
        mapElement.addEventListener(
            "pointercancel",
            function() {
        
                cancelExplorerPress();
        
            }
        );
        
        
        mapElement.addEventListener(
            "pointerleave",
            function() {
        
                cancelExplorerPress();
        
            }
        );
       
        // =========================================================
        // LOAD PANORAMAX VIEWER
        // =========================================================
        
        function loadPanoramaxViewer(
            pictureId,
            sequenceId
        ) {
        
            clearStreetView();
        
            const viewer =
                document.createElement(
                    "pnx-photo-viewer"
                );
        
        
            // -----------------------------------------------------
            // Picture
            // -----------------------------------------------------
        
            viewer.setAttribute(
                "picture",
                pictureId
            );
        
        
            // -----------------------------------------------------
            // Sequence
            // -----------------------------------------------------
        
            if (sequenceId) {
        
                viewer.setAttribute(
                    "sequence",
                    sequenceId
                );
            }
        
        
            // -----------------------------------------------------
            // Widgets
            // -----------------------------------------------------
        
            viewer.setAttribute(
                "widgets",
                "true"
            );
        
        
            // -----------------------------------------------------
            // Size
            // -----------------------------------------------------
        
            viewer.style.width =
                "100%";
        
            viewer.style.height =
                "100%";
        
            viewer.style.display =
                "block";
        
        
            // -----------------------------------------------------
            // IMPORTANT:
            // Set endpoint LAST
            // -----------------------------------------------------
        
            viewer.setAttribute(
                "endpoint",
                "https://api.panoramax.xyz/api"
            );
        
        
            // -----------------------------------------------------
            // Add viewer
            // -----------------------------------------------------
        
            streetViewContainer.appendChild(
                viewer
            );
        
        
            explorerPanorama = viewer;
        
        
            return viewer;
        }

    </script>
