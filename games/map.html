<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>CTW2 Real Temperature Map</title>

    <!-- =====================================================
         LEAFLET
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>
    <script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>

    <!-- =====================================================
         STYLE
    ====================================================== -->

    <style>

        html,
        body {

            width: 100%;
            height: 100%;

            margin: 0;
            padding: 0;

            overflow: hidden;

            background: #111;
        }


        #map {

            width: 100%;
            height: 100%;
        }


        /* =================================================
           TITLE
        ================================================= */

        .map-title {

            position: absolute;

            top: 15px;
            left: 15px;

            z-index: 1000;

            padding: 10px 14px;

            border-radius: 10px;

            background: rgba(20, 20, 20, 0.88);

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 15px;

            font-weight: 700;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.35);
        }


        /* =================================================
           TEMPERATURE LEGEND
        ================================================= */

        .temperature-legend {

            position: absolute;

            right: 20px;
            bottom: 25px;

            z-index: 1000;

            width: 180px;

            padding: 12px;

            border-radius: 10px;

            background:
                rgba(20, 20, 20, 0.90);

            color: white;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            box-shadow:
                0 4px 20px
                rgba(0, 0, 0, 0.35);
        }


        .temperature-legend-title {

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 700;
        }


        .temperature-gradient {

            width: 100%;
            height: 14px;

            border-radius: 5px;

            background:
                linear-gradient(
                    to right,

                    #821692,
                    #0000ff,
                    #00ffff,
                    #00ff00,
                    #ffff00,
                    #ff8000,
                    #ff0000
                );
        }


        .temperature-labels {

            display: flex;

            justify-content:
                space-between;

            margin-top: 5px;

            font-size: 10px;

            color: #ddd;
        }

        /* =========================================================
           CURSOR TEMPERATURE
           ========================================================= */
        
        #temperatureProbe {
            position: absolute;
        
            z-index: 1000;
        
            display: none;
        
            padding: 7px 10px;
        
            border-radius: 8px;
        
            background: rgba(15, 15, 20, 0.90);
        
            color: white;
        
            font-size: 14px;
        
            font-weight: 700;
        
            white-space: nowrap;
        
            pointer-events: none;
        
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        
            backdrop-filter: blur(6px);
        
            transform: translate(14px, -50%);
        }

    </style>

</head>


<body>


    <!-- =====================================================
         TITLE
    ====================================================== -->

    <div class="map-title">


        🌡️ CTW2 Real Temperature Map

    </div>

    <div id="temperatureProbe">
        🌡️ <span id="temperatureProbeValue">--.-°C</span>
    </div>


    <!-- =====================================================
         MAP
    ====================================================== -->

    <div id="map"></div>


    <!-- =====================================================
         LEGEND
    ====================================================== -->

    <div class="temperature-legend">

        <div class="temperature-legend-title">

            Air temperature

        </div>


        <div class="temperature-gradient"></div>


        <div class="temperature-labels">

            <span>-50°C</span>

            <span>0°C</span>

            <span>+50°C</span>

        </div>

    </div>


    <!-- =====================================================
         MAP SCRIPT
    ====================================================== -->

    <script>

        /*
         * ====================================================
         * CREATE MAP
         * ====================================================
         */

        const map = L.map(
            "map",
            {
                center: [20, 0],

                zoom: 2,

                minZoom: 2,

                maxZoom: 8,

                worldCopyJump: true
            }
        );


        /*
         * ====================================================
         * BASE MAP
         * ====================================================
         *
         * We use OpenStreetMap as the geographical base.
         *
         * The temperature layer is placed above it.
         */

        const baseLayer = L.tileLayer(

            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",

            {
                maxZoom: 19,

                attribution:
                    '&copy; OpenStreetMap contributors'
            }

        );


        baseLayer.addTo(map);


        /*
         * ====================================================
         * REAL TEMPERATURE
         * ====================================================
         *
         * This goes through our FastAPI proxy:
         *
         * /map/{z}/{x}/{y}.png
         *
         * FastAPI then requests:
         *
         * OpenWeather temp_new
         */

        const temperatureLayer = L.tileLayer(

            "/map/{z}/{x}/{y}.png",

            {
                opacity: 0.95,

                tileSize: 256,

                updateWhenIdle: true,

                updateWhenZooming: false,

                attribution:
                    "Weather data © OpenWeather"
            }

        );

        // =========================================================
        // NIGHT ZONE
        // =========================================================
        
        const nightLayer = L.terminator({
            resolution: 2,
            fillColor: "#000000",
            fillOpacity: 0.18,
            color: "#111111",
            weight: 0,
            opacity: 0
        });

        temperatureLayer.addTo(map);


        /*
         * ====================================================
         * DEBUG
         * ====================================================
         */

        console.log(
            "🌡️ [CTW2 MAP] Temperature layer loaded."
        );


        console.log(
            "🗺️ [CTW2 MAP] Real temperature source:",
            "/map/{z}/{x}/{y}.png"
        );

        // =========================================================
        // MAP LAYER SWITCHER
        // =========================================================
        
        L.control.layers(
            null,
            {
                "🌡️ Temperature": temperatureLayer,
                "🌙 Night Zone": nightLayer
            },
            {
                collapsed: false
            }
        ).addTo(map);

        // =========================================================
        // UPDATE NIGHT ZONE
        // =========================================================
        
        function updateNightZone() {
            nightLayer.setTime(new Date());
        }
        
        updateNightZone();
        
        setInterval(
            updateNightZone,
            60 * 1000
        );

        // =========================================================
        // CURSOR TEMPERATURE
        // =========================================================
        
        const temperatureProbe =
            document.getElementById(
                "temperatureProbe"
            );
        
        const temperatureProbeValue =
            document.getElementById(
                "temperatureProbeValue"
            );
        
        let temperatureProbeTimer = null;
        
        let temperatureProbeRequestId = 0;
        
        
        // =========================================================
        // HIDE PROBE
        // =========================================================
        
        function hideTemperatureProbe() {
        
            temperatureProbe.style.display =
                "none";
        }
        
        
        // =========================================================
        // SHOW PROBE
        // =========================================================
        
        function showTemperatureProbe(
            containerPoint,
            text
        ) {
        
            temperatureProbe.style.left =
                `${containerPoint.x}px`;
        
            temperatureProbe.style.top =
                `${containerPoint.y}px`;
        
            temperatureProbeValue.textContent =
                text;
        
            temperatureProbe.style.display =
                "block";
        }
        
        
        // =========================================================
        // REQUEST TEMPERATURE
        // =========================================================
        
        async function requestCursorTemperature(
            lat,
            lon,
            containerPoint
        ) {
        
            const requestId =
                ++temperatureProbeRequestId;
        
            showTemperatureProbe(
                containerPoint,
                "..."
            );
        
            try {
        
                const response = await fetch(
                    `/map/temperature?lat=${encodeURIComponent(lat)}&lon=${encodeURIComponent(lon)}`
                );
        
                const data =
                    await response.json();
        
                // Ignore old requests
                if (
                    requestId !==
                    temperatureProbeRequestId
                ) {
                    return;
                }
        
                if (
                    data.error ||
                    typeof data.temperature !== "number"
                ) {
                    hideTemperatureProbe();
                    return;
                }
        
                showTemperatureProbe(
                    containerPoint,
                    `${data.temperature.toFixed(1)}°C`
                );
        
            } catch (error) {
        
                console.error(
                    "🌡️ [CTW2 MAP] Temperature probe error:",
                    error
                );
        
                hideTemperatureProbe();
            }
        }
        
        
        // =========================================================
        // MAP MOUSE MOVE
        // =========================================================
        
        map.on(
            "mousemove",
            function (event) {
        
                // Temperature layer disabled
                if (
                    !map.hasLayer(
                        temperatureLayer
                    )
                ) {
                    hideTemperatureProbe();
                    return;
                }
        
                // Move the existing label immediately
                if (
                    temperatureProbe.style.display ===
                    "block"
                ) {
                    temperatureProbe.style.left =
                        `${event.containerPoint.x}px`;
        
                    temperatureProbe.style.top =
                        `${event.containerPoint.y}px`;
                }
        
                // Cancel previous delayed request
                if (temperatureProbeTimer) {
                    clearTimeout(
                        temperatureProbeTimer
                    );
                }
        
                // Wait a little while before requesting
                // a new temperature.
                temperatureProbeTimer =
                    setTimeout(
                        function () {
        
                            requestCursorTemperature(
                                event.latlng.lat,
                                event.latlng.lng,
                                event.containerPoint
                            );
        
                        },
                        450
                    );
            }
        );
        
        
        // =========================================================
        // MOUSE LEAVE
        // =========================================================
        
        map.on(
            "mouseout",
            function () {
                hideTemperatureProbe();
        
                if (temperatureProbeTimer) {
        
                    clearTimeout(
                        temperatureProbeTimer
                    );
        
                    temperatureProbeTimer =
                        null;
                }
            }
        );
        
        
        // =========================================================
        // LAYER VISIBILITY
        // =========================================================
        
        map.on(
            "overlayadd",
            function (event) {
        
                if (
                    event.layer ===
                    temperatureLayer
                ) {
                    console.log(
                        "🌡️ [CTW2 MAP] Temperature probe enabled."
                    );
                }
            }
        );
        
        
        map.on(
            "overlayremove",
            function (event) {
        
                if (
                    event.layer ===
                    temperatureLayer
                ) {
                    hideTemperatureProbe();
        
                    console.log(
                        "🌡️ [CTW2 MAP] Temperature probe disabled."
                    );
                }
            }
        );

    </script>


</body>

</html>
